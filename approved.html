<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Approved Users</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="/theme.css">
	<style>
		:root {
			--bg-1: #f3efe6;
			--bg-2: #dfecd9;
			--ink: #1e2a21;
			--muted: #5d6a61;
			--panel: rgba(255, 255, 255, 0.86);
			--stroke: rgba(30, 42, 33, 0.14);
			--accent: #14532d;
			--radius: 16px;
			--shadow: 0 22px 52px rgba(20, 52, 33, 0.14);
		}

		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		body {
			min-height: 100vh;
			font-family: "Manrope", sans-serif;
			color: var(--ink);
			background:
				radial-gradient(circle at 15% 20%, rgba(31, 122, 68, 0.18), transparent 38%),
				radial-gradient(circle at 80% 5%, rgba(95, 142, 104, 0.22), transparent 36%),
				linear-gradient(145deg, var(--bg-1), var(--bg-2));
			display: grid;
			place-items: center;
			padding: clamp(12px, 2.2vw, 24px);
		}

		.shell {
			width: min(100%, 1120px);
			max-height: calc(100vh - clamp(24px, 4.4vw, 48px));
			overflow: auto;
			background: var(--panel);
			border: 1px solid var(--stroke);
			border-radius: calc(var(--radius) + 4px);
			box-shadow: var(--shadow);
			padding: clamp(18px, 2.4vw, 24px);
		}

		.brand {
			display: flex;
			justify-content: center;
			margin-bottom: 12px;
		}

		.brand-logo {
			width: min(100%, 280px);
			height: auto;
			display: block;
		}

		h1 {
			font-family: "Playfair Display", serif;
			font-size: clamp(1.6rem, 3.2vw, 2.1rem);
			margin-bottom: 6px;
		}

		.subtitle {
			color: var(--muted);
			line-height: 1.45;
			margin-bottom: 18px;
		}

		.toolbar {
			display: grid;
			grid-template-columns: 1fr auto auto;
			gap: 10px;
			margin-bottom: 12px;
		}

		input {
			width: 100%;
			border: 1px solid var(--stroke);
			border-radius: 10px;
			padding: 11px 12px;
			font: inherit;
			background: #fff;
		}

		button {
			border: none;
			border-radius: 10px;
			padding: 11px 14px;
			font: inherit;
			font-weight: 800;
			cursor: pointer;
			transition: transform 150ms ease, box-shadow 150ms ease, filter 150ms ease;
		}

		button:hover {
			transform: translateY(-2px);
			box-shadow: 0 6px 20px rgba(0, 0, 0, 0.10);
			filter: brightness(1.04);
		}

		button:active {
			transform: translateY(1px);
			box-shadow: none;
		}

		.btn-primary {
			background: var(--accent);
			color: #fff;
		}

		.btn-secondary {
			background: #d7e9dd;
			color: var(--accent);
		}

		.message {
			display: none;
			padding: 10px 12px;
			border-radius: 10px;
			font-size: 0.88rem;
			font-weight: 700;
			margin-bottom: 10px;
		}

		.message.error {
			display: block;
			background: #fde9e2;
			color: #8a2d0a;
			border: 1px solid #f7c3b1;
		}

		.message.success {
			display: block;
			background: #e5f7ea;
			color: #14532d;
			border: 1px solid #b8e7c5;
		}

		.table-wrap {
			overflow: auto;
			border: 1px solid var(--stroke);
			border-radius: 12px;
			background: #fff;
		}

		table {
			width: 100%;
			border-collapse: collapse;
			min-width: 860px;
		}

		th,
		td {
			padding: 10px 11px;
			border-bottom: 1px solid #edf2ed;
			text-align: left;
			font-size: 0.9rem;
		}

		th {
			background: #f5faf7;
			font-size: 0.82rem;
			text-transform: uppercase;
			letter-spacing: 0.04em;
		}

		.empty {
			padding: 16px;
			color: var(--muted);
			font-size: 0.9rem;
		}

		.footer {
			margin-top: 12px;
			display: flex;
			justify-content: flex-end;
			gap: 10px;
			flex-wrap: wrap;
		}

		@media (max-width: 1024px) {
			table {
				min-width: 760px;
			}
		}

		@media (max-width: 860px) {
			.toolbar {
				grid-template-columns: 1fr;
			}

			.brand-logo {
				width: min(100%, 230px);
			}

			.footer {
				justify-content: stretch;
				flex-direction: column;
			}

			.footer button {
				width: 100%;
			}
		}

		@media (max-width: 680px) {
			table {
				min-width: 620px;
			}
		}
	</style>
</head>
<body>
	<main class="shell">
		<div class="brand">
			<img class="brand-logo" src="assets/itrack-final.png" alt="I-Track Project I-Track logo">
		</div>
		<h1>Approved Users</h1>
		<p class="subtitle">View all approved users. These users are allowed to log in.</p>

		<div class="toolbar">
			<input id="adminKey" type="password" placeholder="Enter ADMIN_ACCESS_KEY">
			<button id="loadBtn" class="btn-primary" type="button">Load Approved Users</button>
			<button id="saveBtn" class="btn-secondary" type="button">Save Key</button>
		</div>

		<div id="message" class="message" role="status" aria-live="polite"></div>

		<div class="table-wrap">
			<table>
				<thead>
					<tr>
						<th>Name</th>
						<th>Email</th>
						<th>District</th>
						<th>School</th>
						<th>Created</th>
					</tr>
				</thead>
				<tbody id="approvedBody"></tbody>
			</table>
		</div>

		<div class="footer">
			<button class="btn-secondary" type="button" onclick="window.location.href='dashboard.html'">Dashboard</button>
			<button class="btn-secondary" type="button" onclick="window.location.href='approval.html'">Back to Approval Portal</button>
			<button class="btn-secondary" type="button" onclick="window.location.href='signout.html'">Sign Out</button>
		</div>
	</main>

	<script>
		(function () {
			const isLocalNodeMode = window.location.port === "3000";
			const apiRoot = isLocalNodeMode ? "/api" : "api";

			function apiUrl(path) {
				const normalized = String(path || "").startsWith("/") ? String(path) : ("/" + String(path || ""));
				return apiRoot + normalized;
			}

			const adminKeyInput = document.getElementById("adminKey");
			const loadBtn = document.getElementById("loadBtn");
			const saveBtn = document.getElementById("saveBtn");
			const message = document.getElementById("message");
			const approvedBody = document.getElementById("approvedBody");

			adminKeyInput.value = localStorage.getItem("adminAccessKey") || "";

			function setMessage(text, type) {
				message.textContent = text;
				message.className = "message " + type;
			}

			function clearMessage() {
				message.textContent = "";
				message.className = "message";
			}

			function getAdminKey() {
				return adminKeyInput.value.trim();
			}

			async function parseApiPayload(response) {
				const raw = await response.text();
				if (!raw) {
					return {};
				}

				try {
					return JSON.parse(raw);
				} catch (error) {
					return { message: "Server returned an unexpected response format.", detail: raw };
				}
			}

			function renderRows(users) {
				if (!users.length) {
					approvedBody.innerHTML = '<tr><td class="empty" colspan="5">No approved users found.</td></tr>';
					return;
				}

				approvedBody.innerHTML = users.map(function (user) {
					const name = [user.firstname, user.middlename, user.lastname].filter(Boolean).join(" ");
					const created = user.created_at ? new Date(user.created_at).toLocaleString() : "-";
					return '<tr>' +
						'<td>' + name + '</td>' +
						'<td>' + user.email + '</td>' +
						'<td>' + (user.district || "-") + '</td>' +
						'<td>' + (user.school || "-") + '</td>' +
						'<td>' + created + '</td>' +
					'</tr>';
				}).join("");
			}

			async function loadApprovedUsers() {
				clearMessage();
				const adminKey = getAdminKey();
				if (!adminKey) {
					setMessage("Enter admin access key first.", "error");
					return;
				}

				try {
					const response = await fetch(apiUrl("/admin/approved-users"), {
						credentials: "include",
						headers: { "x-admin-key": adminKey }
					});

					const payload = await parseApiPayload(response);
					if (!response.ok) {
						throw new Error(payload.message || "Failed to load approved users.");
					}

					renderRows(Array.isArray(payload.users) ? payload.users : []);
					setMessage("Approved users loaded.", "success");
				} catch (error) {
					setMessage(error.message || "Failed to load approved users.", "error");
				}
			}

			saveBtn.addEventListener("click", function () {
				const adminKey = getAdminKey();
				if (!adminKey) {
					setMessage("Enter admin access key first.", "error");
					return;
				}

				localStorage.setItem("adminAccessKey", adminKey);
				setMessage("Admin key saved.", "success");
			});

			loadBtn.addEventListener("click", function () {
				loadApprovedUsers();
			});

			approvedBody.addEventListener("click", function () {
				// No row actions on approved users page.
			});
		})();
	</script>

<script src="/theme.js"></script>
</body>
</html>
