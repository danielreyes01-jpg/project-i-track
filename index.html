<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Log In</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="/theme.css">
	<style>
		:root {
			--bg-1: #f3efe6;
			--bg-2: #dfecd9;
			--ink: #1e2a21;
			--muted: #5d6a61;
			--panel: rgba(255, 255, 255, 0.8);
			--stroke: rgba(30, 42, 33, 0.14);
			--accent: #14532d;
			--accent-2: #1f7a44;
			--accent-soft: #d8f0df;
			--radius: 18px;
			--shadow: 0 24px 60px rgba(20, 52, 33, 0.16);
		}

		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		body {
			min-height: 100vh;
			font-family: "Manrope", sans-serif;
			color: var(--ink);
			background:
				radial-gradient(circle at 15% 20%, rgba(31, 122, 68, 0.18), transparent 38%),
				radial-gradient(circle at 80% 5%, rgba(95, 142, 104, 0.22), transparent 36%),
				linear-gradient(145deg, var(--bg-1), var(--bg-2));
			display: grid;
			place-items: center;
			padding: clamp(12px, 2.2vw, 24px);
		}

		.login-shell {
			width: min(100%, 560px);
			max-height: calc(100vh - clamp(24px, 4vw, 48px));
			overflow: auto;
			background: var(--panel);
			backdrop-filter: blur(10px);
			border: 1px solid var(--stroke);
			border-radius: calc(var(--radius) + 4px);
			box-shadow: var(--shadow);
			padding: 30px 24px 24px;
			animation: lift-in 560ms ease-out both;
		}

		.brand {
			display: flex;
			justify-content: center;
			margin-bottom: 14px;
		}

		.brand-logo {
			width: min(100%, 300px);
			height: auto;
			display: block;
		}

		.title {
			font-family: "Playfair Display", serif;
			font-size: clamp(1.7rem, 4vw, 2.1rem);
			line-height: 1.1;
			margin-bottom: 6px;
		}

		.subtitle {
			color: var(--muted);
			margin-bottom: 22px;
			font-size: 0.95rem;
		}

		form {
			display: grid;
			gap: 14px;
		}

		.field {
			display: grid;
			gap: 6px;
		}

		.input-with-action {
			display: flex;
			gap: 8px;
			align-items: center;
		}

		.input-with-action input {
			flex: 1;
		}

		.toggle-btn {
			border: 1px solid rgba(20, 83, 45, 0.24);
			background: #eef7ef;
			color: var(--accent);
			padding: 10px 12px;
			border-radius: 10px;
			font: inherit;
			font-weight: 700;
			cursor: pointer;
		}

		.toggle-btn:hover {
			filter: brightness(0.98);
		}

		.message-box {
			display: none;
			padding: 10px 12px;
			border-radius: 10px;
			font-size: 0.88rem;
			font-weight: 600;
		}

		.message-box.error {
			display: block;
			background: #fde9e2;
			color: #842600;
			border: 1px solid #f7c3b1;
		}

		.message-box.success {
			display: block;
			background: #e5f7ea;
			color: #14532d;
			border: 1px solid #b8e7c5;
		}

		label {
			font-weight: 700;
			letter-spacing: 0.01em;
			font-size: 0.9rem;
		}

		input {
			width: 100%;
			border: 1px solid var(--stroke);
			border-radius: 12px;
			padding: 12px 13px;
			font: inherit;
			color: var(--ink);
			background: rgba(255, 255, 255, 0.95);
			transition: border-color 180ms ease, box-shadow 180ms ease;
		}

		input:focus {
			outline: none;
			border-color: var(--accent-2);
			box-shadow: 0 0 0 4px rgba(31, 122, 68, 0.12);
		}

		.btn {
			border: none;
			border-radius: 12px;
			padding: 12px 14px;
			font: inherit;
			font-weight: 800;
			letter-spacing: 0.01em;
			cursor: pointer;
			transition: transform 150ms ease, box-shadow 150ms ease, filter 150ms ease, background-color 150ms ease;
		}

		.btn:hover {
			transform: translateY(-2px);
			box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
		}

		.btn:active {
			transform: translateY(1px);
			box-shadow: none;
		}

		.btn-login {
			margin-top: 4px;
			background: var(--accent);
			color: #fff;
		}

		.btn-login:hover {
			filter: brightness(1.06);
		}

		.btn-create {
			background: var(--accent-soft);
			color: var(--accent);
			border: 1px solid rgba(20, 83, 45, 0.2);
			margin-top: 2px;
		}

		.btn-create:hover {
			background: #c8e7d3;
		}

		.hint {
			margin-top: 14px;
			font-size: 0.82rem;
			color: var(--muted);
			text-align: center;
		}

		@keyframes lift-in {
			from {
				opacity: 0;
				transform: translateY(12px) scale(0.98);
			}
			to {
				opacity: 1;
				transform: translateY(0) scale(1);
			}
		}

		@media (max-width: 420px) {
			.login-shell {
				padding: 24px 18px 20px;
			}
		}

		@media (min-width: 1100px) {
			.login-shell {
				width: min(100%, 620px);
			}
		}
	</style>
</head>
<body>
	<main class="login-shell" aria-label="Login form">
		<div class="brand">
			<img class="brand-logo" src="assets/itrack-final.png" alt="I-Track Project I-Track logo">
		</div>

		<p class="subtitle">Log in with your username and password.</p>

		<form id="loginForm" action="#" method="post">
			<div class="field">
				<label for="username">Email</label>
				<input id="username" name="username" type="email" autocomplete="username" required>
			</div>

			<div class="field">
				<label for="password">Password</label>
				<div class="input-with-action">
					<input id="password" name="password" type="password" autocomplete="current-password" required>
					<button id="togglePassword" class="toggle-btn" type="button">Show</button>
				</div>
			</div>

			<div id="loginMessage" class="message-box" role="status" aria-live="polite"></div>

			<button class="btn btn-login" type="submit">Log In</button>
			<button class="btn btn-create" type="button" onclick="window.location.href='create.html'">Create Account</button>
		</form>

		<p class="hint">Secure access for authorized users only.</p>
	</main>

	<script>
		(function () {
			const loginForm = document.getElementById("loginForm");
			const usernameInput = document.getElementById("username");
			const passwordInput = document.getElementById("password");
			const togglePasswordBtn = document.getElementById("togglePassword");
			const loginMessage = document.getElementById("loginMessage");
			const isLocalNodeMode = window.location.port === "3000";
			const authEndpoints = isLocalNodeMode
				? {
					login: "api/auth/login",
					me: "api/auth/me"
				}
				: {
					login: "api/auth/login.php",
					me: "api/auth/me.php"
				};

			function setLoginMessage(message, type) {
				loginMessage.textContent = message;
				loginMessage.className = "message-box " + type;
			}

			function clearLoginMessage() {
				loginMessage.textContent = "";
				loginMessage.className = "message-box";
			}

			const urlParams = new URLSearchParams(window.location.search);
			const notice = urlParams.get("notice");
			if (notice) {
				setLoginMessage(notice, "success");
			}

			async function parseApiPayload(response) {
				const raw = await response.text();
				if (!raw) {
					return {};
				}

				try {
					return JSON.parse(raw);
				} catch (error) {
					if (!response.ok) {
						return {
							message: "Unable to reach the API endpoint on this host.",
							detail: raw
						};
					}

					return { message: "Server returned an unexpected response format." };
				}
			}

			togglePasswordBtn.addEventListener("click", function () {
				const hidden = passwordInput.type === "password";
				passwordInput.type = hidden ? "text" : "password";
				togglePasswordBtn.textContent = hidden ? "Hide" : "Show";
			});

			async function checkSession() {
				try {
					const response = await fetch(authEndpoints.me);
					if (response.ok) {
						const payload = await response.json();
						const role = String((payload.user || {}).role || "teacher").toLowerCase();
						window.location.href = (role === "admin" || role === "supervisor") ? "dashboard.html" : "learner.html";
					}
				} catch (error) {
					// Ignore session check errors and stay on login page.
				}
			}

			checkSession();

			loginForm.addEventListener("submit", async function (event) {
				event.preventDefault();
				clearLoginMessage();

				const email = usernameInput.value.trim();
				const password = passwordInput.value;

				try {
					const response = await fetch(authEndpoints.login, {
						method: "POST",
						headers: {
							"Content-Type": "application/json"
						},
						body: JSON.stringify({ email: email, password: password })
					});

					const payload = await parseApiPayload(response);
					if (!response.ok) {
						if (payload.retryAfterSeconds) {
							throw new Error((payload.message || "Login failed.") + " Try again in " + payload.retryAfterSeconds + " seconds.");
						}
						if (typeof payload.attemptsRemaining === "number") {
							throw new Error((payload.message || "Login failed.") + " Attempts remaining: " + payload.attemptsRemaining + ".");
						}
						if (payload.detail) {
							throw new Error((payload.message || "Login failed.") + " Detail: " + payload.detail);
						}
						throw new Error(payload.message || "Login failed.");
					}

					setLoginMessage("Login successful. Redirecting...", "success");
					const role = String((payload.user || {}).role || "teacher").toLowerCase();
					window.location.href = (role === "admin" || role === "supervisor") ? "dashboard.html" : "learner.html";
				} catch (error) {
					setLoginMessage(error.message || "Login failed.", "error");
				}
			});
		})();
	</script>
	<script src="/theme.js"></script>
</body>
</html>
