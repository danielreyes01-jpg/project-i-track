<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Quiz | Project i-Track</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/theme.css">
  <style>
    :root{--navy:#102f49;--blue:#147cb3;--green:#188c6e;--purple:#655ec0;--muted:#647a86;--line:#d9e6e8;--danger:#b42318}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;padding:clamp(12px,2.5vw,34px);background:linear-gradient(145deg,#f4f8fb,#edf6f4);color:var(--navy);font-family:Manrope,Arial,sans-serif}.page{width:min(980px,100%);margin:auto}.nav-menu{display:flex;gap:8px;align-items:center;margin-bottom:16px}.nav-item{border:0;border-radius:10px;padding:10px 13px;background:#fff;color:var(--navy);font:800 .8rem Manrope;cursor:pointer}.nav-greeting{margin-left:auto;color:var(--muted);font-size:.78rem;font-weight:700}.hero,.quiz-panel{border:1px solid var(--line);border-radius:19px;background:#fff;box-shadow:0 13px 35px rgba(16,47,73,.08)}.hero{position:relative;overflow:hidden;padding:clamp(18px,3vw,28px);margin-bottom:15px;border-top:5px solid var(--purple)}.hero::after{content:"🧠";position:absolute;right:24px;top:18px;font-size:3rem;opacity:.14}.eyebrow{margin:0 0 5px;color:var(--purple);font-size:.7rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase}.hero h1{max-width:760px;margin:0;font-size:clamp(1.45rem,3vw,2rem)}.hero p{margin:7px 0 0;max-width:760px;color:var(--muted);line-height:1.5}.quiz-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.quiz-meta span{padding:6px 9px;border-radius:999px;background:#eef0ff;color:#50499f;font-size:.68rem;font-weight:800}.result{display:none;margin-top:15px;padding:14px;border-radius:13px;background:#eaf8f1;border:1px solid #b8e1cf;color:#08745b}.result.show{display:block}.result strong{font-size:1.3rem}.quiz-panel{padding:clamp(16px,3vw,28px)}.question-list{display:grid;gap:14px}.question{padding:17px;border:1px solid var(--line);border-left:4px solid #48a3bd;border-radius:14px;background:#fbfdfd}.question.correct{border-left-color:#20a16e;background:#f3fcf7}.question.incorrect{border-left-color:#d94b42;background:#fff7f6}.question-head{display:flex;justify-content:space-between;gap:12px;margin-bottom:10px}.question-head strong{font-size:.9rem}.points{color:var(--muted);font-size:.7rem;font-weight:800}.prompt{margin:0 0 13px;line-height:1.5}.choices{display:grid;gap:8px}.choice{display:flex;align-items:flex-start;gap:9px;padding:10px 11px;border:1px solid #d5e3e6;border-radius:10px;background:#fff;cursor:pointer}.choice input{margin-top:3px}.answer-input{width:100%;min-height:44px;border:1px solid #bcd3d8;border-radius:10px;padding:10px 12px;font:500 .88rem Manrope}.review{display:grid;gap:5px;margin-top:12px;padding:10px;border-radius:9px;background:#eef5f7;color:#496570;font-size:.76rem}.review b{color:var(--navy)}.actions{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:20px}.primary{border:0;border-radius:11px;padding:12px 18px;background:linear-gradient(135deg,var(--purple),var(--blue));color:#fff;font:800 .85rem Manrope;cursor:pointer}.primary:disabled{opacity:.55}.message{display:none;margin-bottom:14px;padding:11px 13px;border-radius:10px;font-size:.8rem;font-weight:700}.message.show{display:block}.message.error{background:#fff0ef;color:#9e2118}.empty{text-align:center;padding:38px;color:var(--muted)}
    @media(max-width:600px){body{padding:9px}.nav-greeting{display:none}.hero,.quiz-panel{border-radius:15px}.question{padding:13px}.actions{align-items:stretch;flex-direction:column}.primary{width:100%}}
  </style>
</head>
<body>
  <main class="page">
    <nav class="nav-menu" aria-label="Quiz navigation"><button class="nav-item" type="button" onclick="location.href='learning-resources.html'">← Learning Resources</button><span id="navGreeting" class="nav-greeting"></span><button class="nav-item" type="button" onclick="location.href='signout.html'">Sign Out</button></nav>
    <section class="hero"><p class="eyebrow">Online Quiz</p><h1 id="quizTitle">Loading quiz…</h1><p id="quizInstructions"></p><div id="quizMeta" class="quiz-meta"></div><div id="quizResult" class="result"></div></section>
    <section class="quiz-panel"><div id="quizMessage" class="message" role="status"></div><form id="quizForm"><div id="questionList" class="question-list"><div class="empty">Loading questions…</div></div><div class="actions"><span id="progressText" class="points"></span><button id="submitQuiz" class="primary" type="submit">Submit Quiz</button></div></form></section>
  </main>
  <script>
  (function(){
    const byId=(id)=>document.getElementById(id);const esc=(value)=>String(value==null?'':value).replace(/[&<>"']/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const quizId=new URLSearchParams(location.search).get('id');let payload=null;
    async function getJson(url,options){const response=await fetch(url,Object.assign({credentials:'include'},options||{}));const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.message||'Request failed.');return data}
    function showError(message){byId('quizMessage').textContent=message;byId('quizMessage').className='message show error'}
    function normalize(value){return String(value||'').trim().toLocaleLowerCase('en-PH').replace(/\s+/g,' ')}
    function render(){const quiz=payload.quiz||{};const questions=payload.questions||[];const submitted=Boolean(payload.submitted);const role=String(payload.role||'');byId('quizTitle').textContent=quiz.title||'Online Quiz';byId('quizInstructions').textContent=quiz.instructions||'Read every question carefully and submit your answers when finished.';byId('quizMeta').innerHTML='<span>Term '+Number(quiz.term||1)+'</span><span>Quiz '+Number(quiz.activity_number||1)+'</span><span>'+esc(quiz.subject||'General')+'</span><span>'+Number(quiz.total_points||0)+' points</span>';
      if(submitted){byId('quizResult').classList.add('show');byId('quizResult').innerHTML='<strong>'+Number(quiz.score||0)+' / '+Number(quiz.total_points||0)+'</strong> · '+Number(quiz.percentage||0)+'%<br><span>Submitted '+esc(quiz.submitted_at?new Date(quiz.submitted_at).toLocaleString('en-PH'):'')+'</span>'}
      byId('questionList').innerHTML=questions.map((question)=>{const answer=String(question.student_answer||'');const accepted=String(question.correct_answer||'').split('|').map(normalize);const isCorrect=submitted&&answer&&accepted.includes(normalize(answer));const state=submitted?(isCorrect?' correct':' incorrect'):'';let control='';if(question.type==='multiple_choice'||question.type==='true_false'){control='<div class="choices">'+question.options.map((option)=>'<label class="choice"><input type="radio" name="q_'+esc(question.id)+'" value="'+esc(option)+'" '+(answer===option?'checked':'')+' '+(submitted||role!=='student'?'disabled':'')+'> <span>'+esc(option)+'</span></label>').join('')+'</div>'}else control='<input class="answer-input" name="q_'+esc(question.id)+'" value="'+esc(answer)+'" placeholder="Type your answer" '+(submitted||role!=='student'?'disabled':'')+'>';
        const review=submitted||role!=='student'?'<div class="review"><span><b>Student answer:</b> '+esc(answer||'No answer')+'</span><span><b>Correct answer:</b> '+esc(question.correct_answer||'—')+'</span></div>':'';return '<article class="question'+state+'"><div class="question-head"><strong>Question '+Number(question.order)+'</strong><span class="points">'+Number(question.points||1)+' point'+(Number(question.points||1)===1?'':'s')+'</span></div><p class="prompt">'+esc(question.prompt)+'</p>'+control+review+'</article>'}).join('');
      byId('submitQuiz').hidden=submitted||role!=='student';byId('progressText').textContent=submitted?'Quiz completed':role==='student'?'Answer all questions before submitting.':'Teacher answer and result view';
    }
    async function load(){if(!quizId)throw new Error('Quiz link is missing.');const me=await getJson('/api/auth/me');byId('navGreeting').textContent='👤 '+String((me.user||{}).firstname||'Account');payload=await getJson('/api/quizzes/'+encodeURIComponent(quizId));if(payload.role==='student'&&!payload.submitted){await getJson('/api/quizzes/'+encodeURIComponent(quizId)+'/start',{method:'POST'});payload=await getJson('/api/quizzes/'+encodeURIComponent(quizId))}render()}
    byId('quizForm').addEventListener('submit',async(event)=>{event.preventDefault();if(!payload||payload.submitted)return;const answers={};(payload.questions||[]).forEach((question)=>{const selector='[name="q_'+CSS.escape(question.id)+'"]';if(question.type==='identification'){const field=document.querySelector(selector);answers[question.id]=field?field.value:''}else{const checked=document.querySelector(selector+':checked');answers[question.id]=checked?checked.value:''}});if(!confirm('Submit this quiz now? You cannot change your answers afterward.'))return;const button=byId('submitQuiz');button.disabled=true;button.textContent='Submitting…';try{await getJson('/api/quizzes/'+encodeURIComponent(quizId)+'/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({answers})});payload=await getJson('/api/quizzes/'+encodeURIComponent(quizId));render()}catch(error){showError(error.message);button.disabled=false;button.textContent='Submit Quiz'}});
    load().catch((error)=>{showError(error.message);byId('questionList').innerHTML='<div class="empty">Unable to open this quiz.</div>';byId('submitQuiz').hidden=true});
  })();
  </script>
  <script src="/theme.js"></script>
</body>
</html>
