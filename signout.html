<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Signing Out</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="/theme.css">
	<style>
		:root {
			--bg-1: #f4efe5;
			--bg-2: #e3efe0;
			--ink: #1f2a22;
			--muted: #5f6c64;
			--panel: rgba(255, 255, 255, 0.9);
			--stroke: rgba(31, 42, 34, 0.14);
			--shadow: 0 20px 44px rgba(20, 55, 36, 0.14);
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			min-height: 100vh;
			font-family: "Manrope", sans-serif;
			color: var(--ink);
			background:
				radial-gradient(circle at 84% 8%, rgba(62, 145, 92, 0.2), transparent 32%),
				radial-gradient(circle at 8% 18%, rgba(39, 122, 69, 0.15), transparent 32%),
				linear-gradient(145deg, var(--bg-1), var(--bg-2));
			display: grid;
			place-items: center;
			padding: clamp(12px, 2.2vw, 24px);
		}

		.card {
			width: min(100%, 560px);
			background: var(--panel);
			border: 1px solid var(--stroke);
			border-radius: 16px;
			box-shadow: var(--shadow);
			padding: 24px;
			text-align: center;
		}

		.brand {
			display: flex;
			justify-content: center;
			margin-bottom: 10px;
		}

		.brand-logo {
			width: min(100%, 220px);
			height: auto;
			display: block;
		}

		h1 {
			font-size: 1.4rem;
			margin: 0 0 8px;
		}

		p {
			margin: 0;
			color: var(--muted);
		}

		@media (min-width: 1100px) {
			.card {
				width: min(100%, 620px);
			}
		}
	</style>
</head>
<body>
	<main class="card" aria-live="polite">
		<div class="brand">
			<img class="brand-logo" src="assets/project-itrack-logo.png" alt="Project i-Track logo">
		</div>
		<h1>Signing out...</h1>
		<p>Please wait while we securely end your session.</p>
	</main>

	<script>
		(function () {
			async function signOutAndRedirect() {
				try {
					await fetch("/api/auth/logout", { method: "POST" });
				} catch (error) {
					// Continue redirect even if request fails.
				}
				window.location.href = "index.html?notice=Signed%20out%20successfully.";
			}

			signOutAndRedirect();
		})();
	</script>

<script src="/theme.js"></script>
</body>
</html>
