<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Create Account | Project i-Track</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="/theme.css">
	<style>
		:root { --ink:#123d36; --muted:#71817c; --green:#167654; --blue:#147eb3; --line:#bdd9ce; --soft:#f4fbf7; }
		* { box-sizing:border-box; }
		body { height:100vh; margin:0; font-family:"Manrope",sans-serif; color:var(--ink); background:linear-gradient(145deg,#f3f8f6,#eaf5f2); display:grid; place-items:center; padding:10px; overflow:hidden; }
		.account-shell { width:min(100%,780px); position:relative; }
		.account-picker, .account-dialog { background:rgba(255,255,255,.97); border:1px solid var(--line); border-radius:20px; box-shadow:0 22px 60px rgba(15,75,62,.14); }
		.account-picker { position:relative; padding:22px; text-align:center; animation:pop .25s ease-out; }
		.account-picker::before { content:""; position:absolute; top:-10px; left:50%; width:18px; height:18px; background:#fff; border-left:1px solid var(--line); border-top:1px solid var(--line); transform:translateX(-50%) rotate(45deg); }
		h1,h2,p { margin-top:0; }
		.account-picker h1 { font-size:1.2rem; margin-bottom:6px; }
		.account-picker p { color:var(--muted); font-size:.88rem; margin-bottom:16px; }
		.account-types { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
		.account-type { display:flex; align-items:center; gap:12px; min-height:72px; padding:12px; text-align:left; color:var(--ink); background:#fbfefd; border:1px solid var(--line); border-radius:14px; cursor:pointer; transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease, background .18s ease; }
		.account-type:hover, .account-type:focus-visible { transform:translateY(-2px); border-color:#55ad8d; background:#f2fbf7; box-shadow:0 10px 25px rgba(15,95,72,.12); outline:none; }
		.type-icon { width:44px; height:44px; flex:0 0 44px; display:grid; place-items:center; border-radius:12px; background:#e2f1fb; color:#0875ae; font-size:1.25rem; }
		.account-type[data-type="student"] .type-icon { background:#e2f4e8; color:#237a50; }
		.type-copy strong, .type-copy small { display:block; }
		.type-copy strong { font-size:.92rem; }
		.type-copy small { margin-top:2px; color:var(--muted); font-size:.75rem; }
		.account-dialog { display:none; max-height:calc(100vh - 20px); overflow:hidden; }
		.account-dialog.is-open { display:block; animation:pop .25s ease-out; }
		.dialog-head { position:relative; z-index:2; display:flex; align-items:center; gap:10px; padding:11px 16px; background:rgba(244,251,247,.97); border-bottom:1px solid #d6e7df; }
		.dialog-head h2 { flex:1; margin:0; font-size:clamp(1.25rem,3vw,1.7rem); }
		.close-dialog { width:42px; height:42px; border:0; border-radius:50%; background:#e1eee8; color:#527068; font-size:1.35rem; cursor:pointer; }
		.close-dialog:hover { background:#d5e8df; color:#174f40; }
		form { padding:12px 16px 10px; }
		.form-grid { display:grid; grid-template-columns:1fr 1fr; gap:9px 13px; }
		.field { display:grid; gap:7px; }
		.field.full { grid-column:1/-1; }
		label { font-size:.88rem; font-weight:700; color:#164b3d; }
		.required-mark { color:inherit; }
		input { width:100%; min-height:43px; padding:8px 12px; border:1px solid var(--line); border-radius:13px; background:#fff; color:#193f37; font:inherit; transition:border-color .18s ease, box-shadow .18s ease; }
		input:hover { border-color:#8dbfac; }
		input:focus { outline:none; border-color:#298b6c; box-shadow:0 0 0 4px rgba(41,139,108,.12); }
		input:invalid:not(:focus):not(:placeholder-shown) { border-color:var(--line); box-shadow:none; }
		.hint { margin:0; color:var(--muted); font-size:.76rem; }
		.message { display:none; margin:0 20px 4px; padding:11px 13px; border-radius:11px; font-size:.85rem; font-weight:600; }
		.message.error { display:block; background:#fff1ec; color:#8a3519; border:1px solid #f0c8b8; }
		.message.success { display:block; background:#e9f8ee; color:#145b35; border:1px solid #bde2c9; }
		.actions { display:flex; justify-content:flex-end; gap:10px; padding:10px 16px 12px; border-top:1px solid #d6e7df; }
		.actions button { min-height:50px; padding:0 21px; border-radius:12px; font:inherit; font-weight:800; cursor:pointer; transition:transform .18s ease, box-shadow .18s ease; }
		.actions button:hover { transform:translateY(-2px); }
		.cancel { color:#315c51; background:#fff; border:1px solid var(--line); }
		.submit { color:#fff; background:#187554; border:1px solid #187554; }
		.submit:hover { box-shadow:0 9px 22px rgba(24,117,84,.2); }
		@keyframes pop { from { opacity:0; transform:translateY(8px) scale(.985); } to { opacity:1; transform:none; } }
		@media (max-width:600px) { body{padding:10px;} .account-types,.form-grid{grid-template-columns:1fr;} .field.full{grid-column:auto;} .account-dialog{max-height:calc(100vh - 20px);} .actions{position:sticky;bottom:0;background:#fff;} }
	</style>
</head>
<body>
	<main class="account-shell">
		<section id="accountPicker" class="account-picker" aria-labelledby="pickerTitle">
			<h1 id="pickerTitle">Create an account</h1>
			<p>Select the type of account you want to register.</p>
			<div class="account-types">
				<button class="account-type" type="button" data-type="school"><span class="type-icon" aria-hidden="true">▣</span><span class="type-copy"><strong>School Account</strong><small>For teachers and school staff</small></span></button>
				<button class="account-type" type="button" data-type="student"><span class="type-icon" aria-hidden="true">♙</span><span class="type-copy"><strong>Student Account</strong><small>For registered learners</small></span></button>
			</div>
		</section>

		<section id="accountDialog" class="account-dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
			<header class="dialog-head"><span id="dialogIcon" class="type-icon" aria-hidden="true">▣</span><h2 id="dialogTitle">Create School Account</h2><button id="closeDialog" class="close-dialog" type="button" aria-label="Close account form">×</button></header>
			<form id="createForm" novalidate>
				<input id="accountType" type="hidden" value="school">
				<div class="form-grid">
					<div class="field school-only"><label for="district">District <span class="required-mark">*</span></label><input id="district" name="district" type="text" list="districtList" autocomplete="organization" required></div>
					<div class="field school-only"><label for="schoolId">School ID <span class="required-mark">*</span></label><input id="schoolId" name="schoolId" type="text" inputmode="numeric" autocomplete="off" required></div>
					<div class="field student-only full" hidden><label for="lrn">LRN (Must be 12 digits) <span class="required-mark">*</span></label><input id="lrn" name="lrn" type="text" inputmode="numeric" maxlength="12" pattern="[0-9]{12}" placeholder="Enter 12-digit LRN"></div>
					<div class="field full"><label for="school">School Name <span class="required-mark">*</span></label><input id="school" name="school" type="text" list="schoolList" autocomplete="organization" required></div>
					<div class="field full"><label id="nameLabel" for="fullName">Name (Firstname Lastname) <span class="required-mark">*</span></label><input id="fullName" name="fullName" type="text" autocomplete="name" required></div>
					<div class="field full"><label for="email">Email Address <span class="required-mark">*</span></label><input id="email" name="email" type="email" autocomplete="email" required></div>
					<div class="field full"><label for="username">Username <span class="required-mark">*</span></label><input id="username" name="username" type="text" autocomplete="username" minlength="4" required></div>
					<div class="field"><label for="password">Password <span class="required-mark">*</span></label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required><p class="hint">8+ characters with uppercase, lowercase, number and symbol.</p></div>
					<div class="field"><label for="confirmPassword">Confirm Password <span class="required-mark">*</span></label><input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required></div>
				</div>
			</form>
			<div id="createMessage" class="message" role="status" aria-live="polite"></div>
			<footer class="actions"><button id="cancelDialog" class="cancel" type="button">Cancel</button><button class="submit" type="submit" form="createForm">Create Account →</button></footer>
		</section>
		<datalist id="districtList"></datalist><datalist id="schoolList"></datalist>
	</main>
	<script>
	(function(){
		const picker=document.getElementById('accountPicker'),dialog=document.getElementById('accountDialog'),form=document.getElementById('createForm'),message=document.getElementById('createMessage');
		const typeInput=document.getElementById('accountType'),lrn=document.getElementById('lrn'),district=document.getElementById('district'),school=document.getElementById('school');
		let schoolDistrictMap=new Map();
		function setMessage(text,type){message.textContent=text;message.className='message '+type;}
		function clearMessage(){message.textContent='';message.className='message';}
		function openForm(type){
			typeInput.value=type; const student=type==='student';
			document.querySelectorAll('.school-only').forEach(el=>el.hidden=student);document.querySelectorAll('.student-only').forEach(el=>el.hidden=!student);
			district.required=!student;document.getElementById('schoolId').required=!student;lrn.required=student;
			document.getElementById('dialogTitle').textContent=student?'Create Student Account':'Create School Account';document.getElementById('dialogIcon').textContent=student?'♙':'▣';document.getElementById('nameLabel').innerHTML=(student?'Student Name':'Name')+' (Firstname Lastname) <span class="required-mark">*</span>';
			picker.hidden=true;dialog.classList.add('is-open');clearMessage();setTimeout(()=>student?lrn.focus():district.focus(),50);
		}
		function closeForm(){dialog.classList.remove('is-open');picker.hidden=false;form.reset();clearMessage();}
		document.querySelectorAll('.account-type').forEach(btn=>btn.addEventListener('click',()=>openForm(btn.dataset.type)));document.getElementById('closeDialog').addEventListener('click',closeForm);document.getElementById('cancelDialog').addEventListener('click',closeForm);
		const pageParams=new URLSearchParams(location.search);const requestedType=pageParams.get('type');if(requestedType==='school'||requestedType==='student')openForm(requestedType);
		lrn.addEventListener('input',()=>{lrn.value=lrn.value.replace(/\D/g,'').slice(0,12);});
		fetch('/api/reference/district-schools').then(r=>r.ok?r.json():Promise.reject()).then(data=>{(data.districts||[]).forEach(name=>document.getElementById('districtList').append(new Option(name)));Object.entries(data.schoolsByDistrict||{}).forEach(([districtName,schools])=>(schools||[]).forEach(item=>{const name=String(item.name||'').trim();if(name){schoolDistrictMap.set(name.toLowerCase(),districtName);document.getElementById('schoolList').append(new Option(name));}}));}).catch(()=>{});
		function strongPassword(value){return value.length>=8&&/[A-Z]/.test(value)&&/[a-z]/.test(value)&&/\d/.test(value)&&/[^A-Za-z0-9]/.test(value);}
		form.addEventListener('submit',async event=>{event.preventDefault();clearMessage();if(!form.reportValidity())return;const type=typeInput.value;if(type==='student'&&!/^\d{12}$/.test(lrn.value)){setMessage('LRN must contain exactly 12 digits.','error');lrn.focus();return;}const password=document.getElementById('password').value,confirmPassword=document.getElementById('confirmPassword').value;if(!strongPassword(password)){setMessage('Password must contain at least 8 characters with uppercase, lowercase, number and special character.','error');return;}if(password!==confirmPassword){setMessage('Password and confirm password do not match.','error');return;}const parts=document.getElementById('fullName').value.trim().split(/\s+/);const firstname=parts.shift()||'',lastname=parts.pop()||firstname,middlename=parts.join(' ');const derivedDistrict=type==='student'?(schoolDistrictMap.get(school.value.trim().toLowerCase())||'Unassigned'):district.value.trim();const payload={accountType:type,lrn:lrn.value,schoolId:document.getElementById('schoolId').value.trim(),username:document.getElementById('username').value.trim(),email:document.getElementById('email').value.trim(),password,confirmPassword,firstname,lastname,middlename,district:derivedDistrict,school:school.value.trim(),isSupervisor:false};try{const response=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.message||'Unable to create account.');setMessage('Account request submitted. Please wait for administrator approval.','success');form.reset();setTimeout(()=>{if(pageParams.get('embed')==='1'){parent.postMessage('itrack-account-created','*');}else{location.href='index.html?notice='+encodeURIComponent('Account request submitted. Please wait for administrator approval.');}},1400);}catch(error){setMessage(error.message||'Unable to create account.','error');}});
	})();
	</script>
	<script src="/theme.js"></script>
</body>
</html>
