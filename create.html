<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Create Account</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="/theme.css">
	<style>
		:root {
			--bg-1: #f5efe4;
			--bg-2: #e6f0e2;
			--ink: #1f2a22;
			--muted: #5f6c64;
			--panel: rgba(255, 255, 255, 0.84);
			--stroke: rgba(31, 42, 34, 0.14);
			--accent: #175837;
			--focus: #2c8b58;
			--radius: 18px;
			--shadow: 0 24px 58px rgba(20, 55, 36, 0.16);
		}

		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		body {
			min-height: 100vh;
			font-family: "Manrope", sans-serif;
			color: var(--ink);
			background:
				radial-gradient(circle at 88% 8%, rgba(64, 149, 96, 0.22), transparent 32%),
				radial-gradient(circle at 8% 20%, rgba(28, 114, 63, 0.15), transparent 33%),
				linear-gradient(145deg, var(--bg-1), var(--bg-2));
			display: grid;
			place-items: center;
			padding: clamp(12px, 2.2vw, 24px);
		}

		.signup-shell {
			width: min(100%, 860px);
			background: var(--panel);
			backdrop-filter: blur(10px);
			border: 1px solid var(--stroke);
			border-radius: calc(var(--radius) + 4px);
			box-shadow: var(--shadow);
			padding: clamp(18px, 2.6vw, 30px) clamp(16px, 2.2vw, 24px) clamp(18px, 2vw, 24px);
			animation: lift-in 560ms ease-out both;
		}

		.brand {
			display: flex;
			justify-content: center;
			margin-bottom: 14px;
		}

		.brand-logo {
			width: min(100%, 340px);
			height: auto;
			display: block;
		}

		.title {
			font-family: "Playfair Display", serif;
			font-size: clamp(1.7rem, 3.5vw, 2.2rem);
			line-height: 1.1;
			margin-bottom: 6px;
		}

		.subtitle {
			font-size: 0.95rem;
			color: var(--muted);
			line-height: 1.45;
			margin-bottom: 20px;
		}

		form {
			display: grid;
			gap: 14px;
		}

		.grid {
			display: grid;
			grid-template-columns: repeat(2, minmax(0, 1fr));
			gap: 14px;
		}

		.field {
			display: grid;
			gap: 6px;
		}

		.field.full {
			grid-column: 1 / -1;
		}

		.input-with-action {
			display: flex;
			gap: 8px;
			align-items: center;
		}

		.input-with-action input {
			flex: 1;
		}

		.toggle-btn {
			border: 1px solid rgba(23, 88, 55, 0.24);
			background: #edf8f0;
			color: var(--accent);
			padding: 10px 12px;
			border-radius: 10px;
			font: inherit;
			font-weight: 700;
			cursor: pointer;
		}

		.toggle-btn:hover {
			filter: brightness(0.98);
		}

		label {
			font-weight: 700;
			font-size: 0.9rem;
			letter-spacing: 0.01em;
		}

		input,
		select {
			width: 100%;
			padding: 12px 13px;
			border: 1px solid var(--stroke);
			border-radius: 12px;
			font: inherit;
			color: var(--ink);
			background: rgba(255, 255, 255, 0.95);
			transition: border-color 180ms ease, box-shadow 180ms ease;
		}

		input:focus,
		select:focus {
			outline: none;
			border-color: var(--focus);
			box-shadow: 0 0 0 4px rgba(44, 139, 88, 0.14);
		}

		.helper {
			font-size: 0.82rem;
			color: var(--muted);
		}

		.helper.ok {
			color: #1a6a40;
		}

		.helper.warn {
			color: #9a3e00;
		}

		.message-box {
			display: none;
			padding: 10px 12px;
			border-radius: 10px;
			font-size: 0.88rem;
			font-weight: 600;
		}

		.message-box.error {
			display: block;
			background: #fde9e2;
			color: #842600;
			border: 1px solid #f7c3b1;
		}

		.message-box.success {
			display: block;
			background: #e5f7ea;
			color: #14532d;
			border: 1px solid #b8e7c5;
		}

		.actions {
			display: flex;
			gap: 10px;
			margin-top: 4px;
		}

		.btn {
			border: none;
			border-radius: 12px;
			padding: 12px 16px;
			font: inherit;
			font-weight: 800;
			cursor: pointer;
			transition: transform 150ms ease, box-shadow 150ms ease, filter 150ms ease, background-color 150ms ease;
		}

		.btn:hover {
			transform: translateY(-2px);
			box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
		}

		.btn:active {
			transform: translateY(1px);
			box-shadow: none;
		}

		.btn-primary {
			background: var(--accent);
			color: #fff;
		}

		.btn-primary:hover {
			filter: brightness(1.06);
		}

		.btn-secondary {
			background: #e1edde;
			color: var(--accent);
		}

		.btn-secondary:hover {
			filter: brightness(0.98);
		}

		@keyframes lift-in {
			from {
				opacity: 0;
				transform: translateY(12px) scale(0.98);
			}
			to {
				opacity: 1;
				transform: translateY(0) scale(1);
			}
		}

		@media (max-width: 760px) {
			.signup-shell {
				padding: 24px 18px 20px;
			}

			.brand-logo {
				width: min(100%, 240px);
			}

			.grid {
				grid-template-columns: 1fr;
			}

			.actions {
				flex-direction: column;
			}
		}

		@media (min-width: 1100px) {
			.signup-shell {
				width: min(100%, 960px);
			}
		}
	</style>
</head>
<body>
	<main class="signup-shell" aria-label="Create account form">
		<div class="brand">
			<img class="brand-logo" src="assets/itrack-final.png" alt="I-Track Project I-Track logo">
		</div>

		<h1 class="title">Create Your Account</h1>
		<p class="subtitle">Fill out the details below to request an account.</p>

		<form id="createForm" action="#" method="post">
			<div class="grid">
				<div class="field full">
					<label for="email">Email</label>
					<input id="email" name="email" type="email" autocomplete="email" required>
				</div>

				<div class="field full">
					<label for="password">Password</label>
					<div class="input-with-action">
						<input id="password" name="password" type="password" autocomplete="off" required>
						<button id="togglePassword" class="toggle-btn" type="button">Show</button>
					</div>
					<p id="passwordHint" class="helper">Use 8+ chars with uppercase, lowercase, number, and special character.</p>
				</div>

				<div class="field full">
					<label for="confirmPassword">Confirm Password</label>
					<div class="input-with-action">
						<input id="confirmPassword" name="confirmPassword" type="password" autocomplete="off" required>
						<button id="toggleConfirmPassword" class="toggle-btn" type="button">Show</button>
					</div>
					<p id="confirmHint" class="helper">Re-enter the same password.</p>
				</div>

				<div class="field">
					<label for="firstname">First Name</label>
					<input id="firstname" name="firstname" type="text" autocomplete="given-name" required>
				</div>

				<div class="field">
					<label for="lastname">Last Name</label>
					<input id="lastname" name="lastname" type="text" autocomplete="family-name" required>
				</div>

				<div class="field full">
					<label for="middlename">Middle Name</label>
					<input id="middlename" name="middlename" type="text" autocomplete="additional-name">
				</div>

				<div class="field">
					<label for="isSupervisor">Supervisor Account?</label>
					<select id="isSupervisor" name="isSupervisor">
						<option value="no" selected>No</option>
						<option value="yes">Yes</option>
					</select>
				</div>

				<div class="field" id="supervisorFieldWrap" style="display:none;">
					<label for="supervisorRole">Supervisor Role</label>
					<input id="supervisorRole" name="supervisorRole" type="text" value="Supervisor" readonly>
				</div>

				<div class="field">
					<label for="district">District</label>
					<select id="district" name="district" required>
						<option value="" selected disabled>Select District</option>
						<option value="Division Office">Division Office</option>
						<option value="Alcantara">Alcantara</option>
						<option value="Alcoy">Alcoy</option>
						<option value="Alegria">Alegria</option>
						<option value="Aloguinsan">Aloguinsan</option>
						<option value="Argao I">Argao I</option>
						<option value="Argao II">Argao II</option>
						<option value="Asturias II">Asturias II</option>
						<option value="Asturias I">Asturias I</option>
						<option value="Badian">Badian</option>
						<option value="Balamban I">Balamban I</option>
						<option value="Balamban II">Balamban II</option>
						<option value="Bantayan I">Bantayan I</option>
						<option value="Bantayan II">Bantayan II</option>
						<option value="Barili I">Barili I</option>
						<option value="Barili II">Barili II</option>
						<option value="Boljoon">Boljoon</option>
						<option value="Borbon">Borbon</option>
						<option value="Carmen">Carmen</option>
						<option value="Catmon">Catmon</option>
						<option value="Compostela">Compostela</option>
						<option value="Consolacion I">Consolacion I</option>
						<option value="Consolacion II">Consolacion II</option>
						<option value="Cordova">Cordova</option>
						<option value="Daan Bantayan I">Daan Bantayan I</option>
						<option value="Daan Bantayan II">Daan Bantayan II</option>
						<option value="Dalaguete I">Dalaguete I</option>
						<option value="Dalaguete II">Dalaguete II</option>
						<option value="Dumanjug I">Dumanjug I</option>
						<option value="Dumanjug II">Dumanjug II</option>
						<option value="Ginatilan">Ginatilan</option>
						<option value="Liloan">Liloan</option>
						<option value="Madridejos">Madridejos</option>
						<option value="Malabuyoc">Malabuyoc</option>
						<option value="Medellin">Medellin</option>
						<option value="Minglanilla I">Minglanilla I</option>
						<option value="Minglanilla II">Minglanilla II</option>
						<option value="Moalboal">Moalboal</option>
						<option value="Oslob">Oslob</option>
						<option value="Pilar">Pilar</option>
						<option value="Pinamungajan I">Pinamungajan I</option>
						<option value="Pinamungajan II">Pinamungajan II</option>
						<option value="Poro">Poro</option>
						<option value="Ronda">Ronda</option>
						<option value="Samboan">Samboan</option>
						<option value="San Fernando I">San Fernando I</option>
						<option value="San Fernando II">San Fernando II</option>
						<option value="San Francisco">San Francisco</option>
						<option value="San Remigio I">San Remigio I</option>
						<option value="San Remigio II">San Remigio II</option>
						<option value="Santa Fe">Santa Fe</option>
						<option value="Santander">Santander</option>
						<option value="Sibonga">Sibonga</option>
						<option value="Sogod">Sogod</option>
						<option value="Tabogon">Tabogon</option>
						<option value="Tabuelan">Tabuelan</option>
						<option value="Tuburan I">Tuburan I</option>
						<option value="Tuburan II">Tuburan II</option>
						<option value="Tudela">Tudela</option>
					</select>
				</div>

				<div class="field">
					<label for="school">School</label>
					<select id="school" name="school" required disabled>
						<option value="" selected disabled>Select School</option>
					</select>
					<p class="helper" id="schoolHelper">Select a district first to view its schools.</p>
				</div>
			</div>

			<div id="createMessage" class="message-box" role="status" aria-live="polite"></div>

			<div class="actions">
				<button class="btn btn-primary" type="submit">Create Account</button>
				<button class="btn btn-secondary" type="button" onclick="window.location.href='index.html'">Back to Log In</button>
			</div>
		</form>
	</main>

	<script>
		(function () {
			const referenceApiUrl = window.location.port === "3000"
				? "/api/reference/district-schools"
				: "api/reference/district-schools.php";

			const createForm = document.getElementById("createForm");
			const passwordInput = document.getElementById("password");
			const confirmPasswordInput = document.getElementById("confirmPassword");
			const togglePasswordBtn = document.getElementById("togglePassword");
			const toggleConfirmPasswordBtn = document.getElementById("toggleConfirmPassword");
			const passwordHint = document.getElementById("passwordHint");
			const confirmHint = document.getElementById("confirmHint");
			const createMessage = document.getElementById("createMessage");
			const isSupervisorSelect = document.getElementById("isSupervisor");
			const supervisorFieldWrap = document.getElementById("supervisorFieldWrap");
			const districtSelect = document.getElementById("district");
			const schoolSelect = document.getElementById("school");
			const schoolHelper = document.getElementById("schoolHelper");
			let districtSchoolReference = null;

			function setCreateMessage(message, type) {
				createMessage.textContent = message;
				createMessage.className = "message-box " + type;
			}

			function clearCreateMessage() {
				createMessage.textContent = "";
				createMessage.className = "message-box";
			}

			function setSchoolOptionsForDistrict(district) {
				schoolSelect.innerHTML = '<option value="" selected disabled>Select School</option>';
				if (!district || !districtSchoolReference || !districtSchoolReference.schoolsByDistrict) {
					schoolSelect.disabled = true;
					schoolHelper.textContent = "Select a district first to view its schools.";
					schoolHelper.className = "helper";
					return;
				}

				const schools = Array.isArray(districtSchoolReference.schoolsByDistrict[district])
					? districtSchoolReference.schoolsByDistrict[district]
					: [];

				if (!schools.length) {
					schoolSelect.disabled = true;
					schoolHelper.textContent = "No schools listed for this district.";
					schoolHelper.className = "helper warn";
					return;
				}

				schools.forEach(function (school) {
					const option = document.createElement("option");
					const name = String((school && school.name) || "").trim();
					const schoolId = String((school && school.id) || "").trim();
					option.value = name;
					option.textContent = schoolId ? (name + " (" + schoolId + ")") : name;
					schoolSelect.appendChild(option);
				});

				schoolSelect.disabled = false;
				schoolHelper.textContent = "School options are filtered by selected district.";
				schoolHelper.className = "helper ok";
			}

			async function loadDistrictSchoolReference() {
				try {
					const response = await fetch(referenceApiUrl);
					const payload = await parseApiPayload(response);
					if (!response.ok) {
						throw new Error(payload.message || "Failed to load district/school reference.");
					}

					districtSchoolReference = payload;
					const districts = Array.isArray(payload.districts) ? payload.districts : [];
					districtSelect.innerHTML = '<option value="" selected disabled>Select District</option>';
					districts.forEach(function (district) {
						const option = document.createElement("option");
						option.value = String(district || "").trim();
						option.textContent = String(district || "").trim();
						districtSelect.appendChild(option);
					});

					setSchoolOptionsForDistrict("");
				} catch (error) {
					schoolSelect.disabled = true;
					schoolHelper.textContent = "Unable to load school list. Please refresh the page.";
					schoolHelper.className = "helper warn";
				}
			}

			function toggleSupervisorField() {
				const isSupervisor = isSupervisorSelect.value === "yes";
				supervisorFieldWrap.style.display = isSupervisor ? "grid" : "none";
			}

			async function parseApiPayload(response) {
				const raw = await response.text();
				if (!raw) {
					return {};
				}

				try {
					return JSON.parse(raw);
				} catch (error) {
					return {
						message: "Server returned an unexpected response format.",
						detail: raw
					};
				}
			}

			function passwordChecks(password) {
				return {
					length: password.length >= 8,
					upper: /[A-Z]/.test(password),
					lower: /[a-z]/.test(password),
					number: /[0-9]/.test(password),
					special: /[^A-Za-z0-9]/.test(password)
				};
			}

			function isStrongPassword(password) {
				const checks = passwordChecks(password);
				return checks.length && checks.upper && checks.lower && checks.number && checks.special;
			}

			function updatePasswordHints() {
				const password = passwordInput.value;
				const confirmPassword = confirmPasswordInput.value;

				if (!password) {
					passwordHint.textContent = "Use 8+ chars with uppercase, lowercase, number, and special character.";
					passwordHint.className = "helper";
				} else if (isStrongPassword(password)) {
					passwordHint.textContent = "Strong password.";
					passwordHint.className = "helper ok";
				} else {
					passwordHint.textContent = "Weak password. Add missing uppercase, lowercase, number, or special character.";
					passwordHint.className = "helper warn";
				}

				if (!confirmPassword) {
					confirmHint.textContent = "Re-enter the same password.";
					confirmHint.className = "helper";
				} else if (confirmPassword === password) {
					confirmHint.textContent = "Passwords match.";
					confirmHint.className = "helper ok";
				} else {
					confirmHint.textContent = "Passwords do not match.";
					confirmHint.className = "helper warn";
				}
			}

			passwordInput.addEventListener("input", updatePasswordHints);
			confirmPasswordInput.addEventListener("input", updatePasswordHints);

			togglePasswordBtn.addEventListener("click", function () {
				const hidden = passwordInput.type === "password";
				passwordInput.type = hidden ? "text" : "password";
				togglePasswordBtn.textContent = hidden ? "Hide" : "Show";
			});

			toggleConfirmPasswordBtn.addEventListener("click", function () {
				const hidden = confirmPasswordInput.type === "password";
				confirmPasswordInput.type = hidden ? "text" : "password";
				toggleConfirmPasswordBtn.textContent = hidden ? "Hide" : "Show";
			});

			isSupervisorSelect.addEventListener("change", toggleSupervisorField);
			districtSelect.addEventListener("change", function () {
				setSchoolOptionsForDistrict(districtSelect.value);
			});
			toggleSupervisorField();
			loadDistrictSchoolReference();

			createForm.addEventListener("submit", async function (event) {
				event.preventDefault();
				clearCreateMessage();

				const password = passwordInput.value;
				const confirmPassword = confirmPasswordInput.value;

				if (!isStrongPassword(password)) {
					setCreateMessage("Password is too weak. Use 8+ chars with uppercase, lowercase, number, and special character.", "error");
					return;
				}

				if (password !== confirmPassword) {
					setCreateMessage("Password and confirm password do not match.", "error");
					return;
				}

				const accountData = {
					email: document.getElementById("email").value.trim(),
					password: password,
					confirmPassword: confirmPassword,
					firstname: document.getElementById("firstname").value.trim(),
					lastname: document.getElementById("lastname").value.trim(),
					middlename: document.getElementById("middlename").value.trim(),
					district: document.getElementById("district").value.trim(),
					school: document.getElementById("school").value.trim(),
					isSupervisor: document.getElementById("isSupervisor").value === "yes"
				};

				try {
					const response = await fetch("/api/auth/register", {
						method: "POST",
						headers: {
							"Content-Type": "application/json"
						},
						body: JSON.stringify(accountData)
					});

					const payload = await parseApiPayload(response);
					if (!response.ok) {
						if (response.status === 405) {
							throw new Error("Create account API is not available on this host (HTTP 405).");
						}

						if (response.status === 404) {
							throw new Error("Create account API endpoint not found on this host (HTTP 404).");
						}

						const fullMessage = [payload.message, payload.detail].filter(Boolean).join(" ");
						throw new Error(fullMessage || ("Unable to create account. (HTTP " + response.status + ")"));
					}

					setCreateMessage("Account request submitted. Please wait for admin approval.", "success");
					setTimeout(function () {
						window.location.href = "index.html?notice=" + encodeURIComponent("Account request submitted. Please wait for admin approval.");
					}, 1200);
				} catch (error) {
					const message = String(error && error.message ? error.message : "");
					if (message.toLowerCase().includes("failed to fetch")) {
						setCreateMessage("Cannot reach API endpoint on this host. Verify API routes and server configuration.", "error");
						return;
					}

					setCreateMessage(message || "Unable to create account.", "error");
				}
			});
		})();
	</script>

<script src="/theme.js"></script>
</body>
</html>
