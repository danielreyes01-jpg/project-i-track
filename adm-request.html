<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>ADM Request Form</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="/theme.css">
	<style>
		:root {
			--bg-1: #f3efe6;
			--bg-2: #dfecd9;
			--ink: #1e2a21;
			--muted: #5d6a61;
			--panel: rgba(255, 255, 255, 0.9);
			--stroke: rgba(30, 42, 33, 0.12);
			--accent: #14532d;
			--accent-soft: #d7e9dd;
			--success-bg: #e5f7ea;
			--success-ink: #14532d;
			--error-bg: #fde9e2;
			--error-ink: #8a2d0a;
		}

		* { box-sizing: border-box; }

		body {
			margin: 0;
			min-height: 100vh;
			font-family: "Manrope", sans-serif;
			color: var(--ink);
			background:
				radial-gradient(circle at 10% 20%, rgba(31, 122, 68, 0.16), transparent 34%),
				radial-gradient(circle at 88% 12%, rgba(95, 142, 104, 0.22), transparent 28%),
				linear-gradient(145deg, var(--bg-1), var(--bg-2));
			padding: 24px;
		}

		.page {
			max-width: 1180px;
			margin: 0 auto;
			display: grid;
			gap: 18px;
		}

		.panel {
			background: var(--panel);
			border: 1px solid var(--stroke);
			border-radius: 18px;
			box-shadow: 0 24px 48px rgba(20, 52, 33, 0.12);
			padding: 22px;
		}

		.header {
			display: flex;
			justify-content: space-between;
			align-items: flex-start;
			gap: 14px;
			flex-wrap: wrap;
		}

		h1 {
			margin: 0;
			font-family: "Playfair Display", serif;
			font-size: clamp(1.45rem, 2.6vw, 2rem);
		}

		.subtitle {
			margin: 4px 0 0;
			color: var(--muted);
			font-size: 0.92rem;
		}

		.actions {
			display: flex;
			gap: 10px;
			flex-wrap: wrap;
		}

		button {
			border: none;
			border-radius: 10px;
			padding: 10px 14px;
			font: inherit;
			font-weight: 800;
			cursor: pointer;
		}

		.btn-primary { background: var(--accent); color: #fff; }
		.btn-secondary { background: var(--accent-soft); color: var(--accent); }

		.message {
			display: none;
			padding: 10px 12px;
			border-radius: 10px;
			font-size: 0.88rem;
			font-weight: 700;
		}

		.message.success { display: block; background: var(--success-bg); color: var(--success-ink); border: 1px solid #b8e7c5; }
		.message.error { display: block; background: var(--error-bg); color: var(--error-ink); border: 1px solid #f7c3b1; }

		.form-grid {
			display: grid;
			grid-template-columns: repeat(2, minmax(0, 1fr));
			gap: 16px;
			margin-top: 18px;
		}

		.field {
			display: grid;
			gap: 6px;
		}

		.field.full {
			grid-column: 1 / -1;
		}

		label {
			font-size: 0.86rem;
			font-weight: 700;
		}

		input {
			width: 100%;
			border: 1px solid var(--stroke);
			border-radius: 10px;
			padding: 11px 12px;
			font: inherit;
			background: #fff;
		}

		.docs-label {
			font-size: 0.82rem;
			text-transform: uppercase;
			letter-spacing: 0.06em;
			color: var(--muted);
			font-weight: 800;
			margin-top: 8px;
		}

		.req { color: #c0392b; margin-left: 2px; }

		input.field-invalid {
			border-color: #e74c3c;
			background: #fff8f8;
		}

		.doc-no-file { font-size: 0.8rem; color: var(--muted); font-style: italic; }

		.submit-row {
			margin-top: 18px;
			display: flex;
			justify-content: flex-end;
		}

		.table-wrap {
			overflow: auto;
			border: 1px solid var(--stroke);
			border-radius: 14px;
			background: rgba(255,255,255,0.88);
		}

		table {
			width: 100%;
			border-collapse: collapse;
			min-width: 960px;
		}

		th, td {
			padding: 12px 10px;
			border-bottom: 1px solid rgba(31, 42, 34, 0.1);
			text-align: left;
			vertical-align: top;
			font-size: 0.88rem;
		}

		th {
			background: rgba(20, 83, 45, 0.06);
			color: var(--muted);
			font-size: 0.78rem;
			text-transform: uppercase;
			letter-spacing: 0.04em;
		}

		.status-pill {
			display: inline-flex;
			padding: 5px 10px;
			border-radius: 999px;
			font-size: 0.76rem;
			font-weight: 800;
			text-transform: capitalize;
			background: rgba(20, 83, 45, 0.08);
			color: var(--accent);
		}

		a.doc-link {
			color: var(--accent);
			font-weight: 700;
			text-decoration: none;
			display: inline-block;
			margin-bottom: 4px;
		}

		a.doc-link:hover { text-decoration: underline; }

		.result-meta {
			display: grid;
			gap: 4px;
			color: var(--muted);
			font-size: 0.82rem;
		}

		.result-note {
			color: var(--ink);
			font-weight: 700;
		}

		.empty {
			text-align: center;
			font-style: italic;
			color: var(--muted);
		}

		@media (max-width: 760px) {
			.form-grid {
				grid-template-columns: 1fr;
			}
		}
	</style>
</head>
<body>
	<div class="nav-panel">
		<nav class="nav-menu" aria-label="Teacher navigation">
			<button class="nav-item" type="button" onclick="window.location.href='learner.html'">📋 Learner Record</button>
			<button class="nav-item" type="button" onclick="window.location.href='adm-request.html'">📄 ADM Request</button>
			<span id="navGreeting" class="nav-greeting"></span>
			<button class="nav-item nav-item-signout" type="button" onclick="window.location.href='signout.html'">↪ Sign Out</button>
		</nav>
	</div>
	<div class="page">
		<section class="panel">
			<div class="header">
				<div>
					<h1>ADM Request Form</h1>
					<p class="subtitle">Teacher accounts can submit ADM requests with PSDS Endorsement and Secondary Supporting Document files.</p>
				</div>
			</div>
			<div id="message" class="message" role="status" aria-live="polite"></div>
			<form id="admRequestForm" novalidate>
				<div class="form-grid">
					<div class="field">
						<label for="requestDate">Date</label>
						<input id="requestDate" name="requestDate" type="date" required>
					</div>
					<div class="field">
						<label for="admFocal">ADM Focal</label>
						<input id="admFocal" name="admFocal" type="text" placeholder="Enter ADM focal" required>
					</div>
					<div class="field">
						<label for="district">District</label>
						<input id="district" name="district" type="text" readonly>
					</div>
					<div class="field">
						<label for="school">School</label>
						<input id="school" name="school" type="text" readonly>
					</div>
					<div class="field full">
						<div class="docs-label">Documents</div>
					</div>
					<div class="field">
				<label for="psdsEndorsement">Upload file for PSDS Endorsement<span class="req" aria-hidden="true">*</span></label>
						<input id="psdsEndorsement" name="psdsEndorsement" type="file" accept=".pdf,.png,.jpg,.jpeg,.doc,.docx" required>
					</div>
					<div class="field">
				<label for="secondarySupportingDocument">Secondary Supporting Document<span class="req" aria-hidden="true">*</span></label>
						<input id="secondarySupportingDocument" name="secondarySupportingDocument" type="file" accept=".pdf,.png,.jpg,.jpeg,.doc,.docx" required>
					</div>
				</div>
				<div class="submit-row">
					<button id="submitBtn" class="btn-primary" type="submit">Submit ADM Request</button>
				</div>
			</form>
		</section>

		<section class="panel">
			<div class="header">
				<div>
					<h1>My ADM Requests</h1>
					<p class="subtitle">Track the status of your submitted ADM requests.</p>
				</div>
			</div>
			<div class="table-wrap">
				<table>
					<thead>
						<tr>
							<th>Date</th>
							<th>District</th>
							<th>School</th>
							<th>ADM Focal</th>
							<th>Documents</th>
							<th>Result</th>
							<th>Status</th>
						</tr>
					</thead>
					<tbody id="requestTableBody">
						<tr><td class="empty" colspan="7">No ADM requests yet.</td></tr>
					</tbody>
				</table>
			</div>
		</section>
	</div>

	<script>
		(function () {
			const form = document.getElementById("admRequestForm");
			const message = document.getElementById("message");
			const requestTableBody = document.getElementById("requestTableBody");
			const submitBtn = document.getElementById("submitBtn");
			const requestDateInput = document.getElementById("requestDate");
			const districtInput = document.getElementById("district");
			const schoolInput = document.getElementById("school");
			let requestRefreshTimer = null;
			let requestEventSource = null;

			function setMessage(text, type) {
				message.textContent = text;
				message.className = "message " + type;
			}

			function escapeHtml(value) {
				return String(value == null ? "" : value)
					.replace(/&/g, "&amp;")
					.replace(/</g, "&lt;")
					.replace(/>/g, "&gt;")
					.replace(/\"/g, "&quot;")
					.replace(/'/g, "&#39;");
			}

			function formatDateTime(value) {
				if (!value) return "N/A";
				const date = new Date(value);
				if (Number.isNaN(date.getTime())) return String(value);
				return date.toLocaleString([], {
					year: "numeric",
					month: "short",
					day: "numeric",
					hour: "numeric",
					minute: "2-digit"
				});
			}

			function formatRequestDate(value) {
				if (!value) return "N/A";
				const parts = String(value).split("-");
				if (parts.length !== 3) return String(value);
				const date = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
				if (Number.isNaN(date.getTime())) return String(value);
				return date.toLocaleDateString([], {
					year: "numeric",
					month: "short",
					day: "numeric"
				});
			}

			function formatStatusLabel(status) {
				const normalized = String(status || "pending").trim().toLowerCase() || "pending";
				if (normalized === "approved") return "APPROVED";
				if (normalized === "revise") return "REVISED";
				if (normalized === "rejected") return "Rejected";
				return normalized.charAt(0).toUpperCase() + normalized.slice(1);
			}

			async function parseApiPayload(response) {
				const raw = await response.text();
				if (!raw) return {};
				try {
					return JSON.parse(raw);
				} catch (e) {
					return { message: "Server returned an unexpected response." };
				}
			}

			function makeDocLink(storedPath, label) {
				const p = String(storedPath || "").trim();
				if (!p) return '<span class="doc-no-file">No document</span>';
				const href = "/" + p.replace(/^\//, "");
				const ext = p.split(".").pop().toLowerCase();
				const extBadge = ext ? ' <span style="font-size:0.72rem;opacity:0.7;">(' + escapeHtml(ext.toUpperCase()) + ')</span>' : '';
				return '<a class="doc-link" href="' + encodeURI(href) + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(label) + extBadge + '</a>';
			}

			function renderRows(requests) {
				requestTableBody.innerHTML = "";
				if (!Array.isArray(requests) || !requests.length) {
					requestTableBody.innerHTML = '<tr><td class="empty" colspan="7">No ADM requests yet.</td></tr>';
					return;
				}

				requestTableBody.innerHTML = requests.map(function (item) {
					const status = String(item.status || "pending").trim().toLowerCase() || "pending";
					const resultParts = [];
					if (item.review_note) {
						resultParts.push('<div class="result-note">' + escapeHtml(item.review_note) + '</div>');
					}
					if (item.reviewed_by) {
						resultParts.push('<div>Reviewed by: ' + escapeHtml(item.reviewed_by) + '</div>');
					}
					if (item.reviewed_at) {
						resultParts.push('<div>Reviewed on: ' + escapeHtml(formatDateTime(item.reviewed_at)) + '</div>');
					}
					// Show approval PDF download link when status is approved
					if (status === "approved") {
						const approvalHref = String(item.approval_pdf_path || "").trim()
							? "/" + String(item.approval_pdf_path || "").trim().replace(/^\//, "")
							: "/assets/documents/ADM-Approval.pdf";
						resultParts.push('<div><a class="doc-link" href="' + encodeURI(approvalHref) + '" target="_blank" rel="noopener noreferrer" style="margin-top: 8px; display: inline-flex; align-items: center; gap: 6px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink: 0;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg> Download Approval (PDF)</a></div>');
					}
					const resultMarkup = resultParts.length
						? '<div class="result-meta">' + resultParts.join("") + '</div>'
						: '';
					return '<tr>' +
						'<td>' + escapeHtml(formatRequestDate(item.request_date)) + '</td>' +
						'<td>' + escapeHtml(item.district || "N/A") + '</td>' +
						'<td>' + escapeHtml(item.school || "N/A") + '</td>' +
						'<td>' + escapeHtml(item.adm_focal || "N/A") + '</td>' +
						'<td>' +
						makeDocLink(item.psds_endorsement_path, "PSDS Endorsement") +
						makeDocLink(item.secondary_document_path, "Secondary Supporting Document") +
						'</td>' +
						'<td>' + resultMarkup + '</td>' +
						'<td><span class="status-pill">' + escapeHtml(formatStatusLabel(status)) + '</span></td>' +
					'</tr>';
				}).join("");
			}

			async function loadRequests(options) {
				const silent = Boolean(options && options.silent);
				try {
					const response = await fetch("/api/adm-requests", { credentials: "include" });
					if (!response.ok) {
						const payload = await parseApiPayload(response);
						throw new Error(payload.message || "Failed to load ADM requests.");
					}
					const payload = await parseApiPayload(response);
					renderRows(Array.isArray(payload.requests) ? payload.requests : []);
				} catch (error) {
					requestTableBody.innerHTML = '<tr><td class="empty" colspan="7">Unable to load ADM requests right now.</td></tr>';
					if (!silent) {
						setMessage(String(error && error.message ? error.message : "Failed to load ADM requests."), "error");
					}
				}
			}

			function connectRequestStream() {
				if (typeof window.EventSource !== "function") return;
				if (requestEventSource) {
					requestEventSource.close();
					requestEventSource = null;
				}

				requestEventSource = new EventSource("/api/adm-requests/stream", { withCredentials: true });
				requestEventSource.addEventListener("adm-request-updated", function () {
					loadRequests({ silent: true });
				});
				requestEventSource.onerror = function () {
					if (requestEventSource) {
						requestEventSource.close();
						requestEventSource = null;
					}
					setTimeout(connectRequestStream, 3000);
				};
			}

			async function checkTeacherSession() {
				try {
					const response = await fetch("/api/auth/me", { credentials: "include" });
					if (!response.ok) {
						window.location.href = "index.html";
						return false;
					}
					const payload = await parseApiPayload(response);
					const user = payload.user || {};
					const role = String((user || {}).role || "teacher").toLowerCase();
					if (role !== "teacher" && role !== "admin") {
						window.location.href = "dashboard.html";
						return false;
					}
					districtInput.value = String(user.district || "").trim();
					schoolInput.value = String(user.school || "").trim();
					const navGreeting = document.getElementById("navGreeting");
					const teacherName = String(user.firstname || "").trim();
					if (navGreeting && teacherName) navGreeting.textContent = "👤 " + teacherName;
					if (!requestDateInput.value) {
						requestDateInput.value = new Date().toISOString().slice(0, 10);
					}
					return true;
				} catch (error) {
					window.location.href = "index.html";
					return false;
				}
			}

			form.addEventListener("submit", async function (event) {
				event.preventDefault();
				setMessage("", "");

				const psdsInput = document.getElementById("psdsEndorsement");
				const secondaryInput = document.getElementById("secondarySupportingDocument");
				const psdsFile = psdsInput.files[0];
				const secondaryFile = secondaryInput.files[0];

				psdsInput.classList.toggle("field-invalid", !psdsFile);
				secondaryInput.classList.toggle("field-invalid", !secondaryFile);

				if (!psdsFile && !secondaryFile) {
					setMessage("Both documents are required: PSDS Endorsement and Secondary Supporting Document.", "error");
					psdsInput.focus();
					return;
				}
				if (!psdsFile) {
					setMessage("PSDS Endorsement document is required.", "error");
					psdsInput.focus();
					return;
				}
				if (!secondaryFile) {
					setMessage("Secondary Supporting Document is required.", "error");
					secondaryInput.focus();
					return;
				}

				const formData = new FormData();
				formData.append("requestDate", String(document.getElementById("requestDate").value || "").trim());
				formData.append("admFocal", String(document.getElementById("admFocal").value || "").trim());
				formData.append("psdsEndorsement", psdsFile);
				formData.append("secondarySupportingDocument", secondaryFile);

				submitBtn.disabled = true;
				try {
					const response = await fetch("/api/adm-requests", {
						method: "POST",
						credentials: "include",
						body: formData
					});
					const payload = await parseApiPayload(response);
					if (!response.ok) {
						throw new Error(payload.message || "Failed to submit ADM request.");
					}
					setMessage(payload.message || "ADM request submitted.", "success");
					localStorage.setItem("admRequestSubmittedAt", String(Date.now()));
					form.reset();
					requestDateInput.value = new Date().toISOString().slice(0, 10);
					await checkTeacherSession();
					loadRequests();
				} catch (error) {
					setMessage(String(error && error.message ? error.message : "Failed to submit ADM request."), "error");
				} finally {
					submitBtn.disabled = false;
				}
			});

			document.getElementById("psdsEndorsement").addEventListener("change", function () {
				this.classList.remove("field-invalid");
			});
			document.getElementById("secondarySupportingDocument").addEventListener("change", function () {
				this.classList.remove("field-invalid");
			});

			window.addEventListener("storage", function (event) {
				if (event.key === "admRequestStatusUpdatedAt" || event.key === "admRequestSubmittedAt") {
					loadRequests({ silent: true });
				}
			});

			window.addEventListener("focus", function () {
				loadRequests({ silent: true });
			});

			document.addEventListener("visibilitychange", function () {
				if (document.visibilityState === "visible") {
					loadRequests({ silent: true });
				}
			});

			checkTeacherSession().then(function (ok) {
				if (ok) {
					loadRequests();
					connectRequestStream();
					requestRefreshTimer = setInterval(function () {
						loadRequests({ silent: true });
					}, 15 * 1000);
					window.addEventListener("beforeunload", function () {
						if (requestRefreshTimer) {
							clearInterval(requestRefreshTimer);
							requestRefreshTimer = null;
						}
						if (requestEventSource) {
							requestEventSource.close();
							requestEventSource = null;
						}
					});
				}
			});
		})();
	</script>

<script src="/theme.js"></script>
</body>
</html>
