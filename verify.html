<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Email Verification</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="/theme.css">
	<style>
		:root {
			--bg-1: #f4f0e7;
			--bg-2: #ddeedd;
			--ink: #1f2b24;
			--muted: #5d6b63;
			--panel: rgba(255, 255, 255, 0.86);
			--stroke: rgba(31, 43, 36, 0.14);
			--accent: #17603b;
			--accent-soft: #d7ecd9;
			--radius: 18px;
			--shadow: 0 24px 56px rgba(20, 56, 36, 0.14);
		}

		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		body {
			min-height: 100vh;
			font-family: "Manrope", sans-serif;
			color: var(--ink);
			background:
				radial-gradient(circle at 12% 18%, rgba(47, 130, 72, 0.2), transparent 34%),
				radial-gradient(circle at 85% 10%, rgba(72, 152, 98, 0.19), transparent 30%),
				linear-gradient(145deg, var(--bg-1), var(--bg-2));
			display: grid;
			place-items: center;
			padding: clamp(12px, 2.2vw, 24px);
		}

		.verify-shell {
			width: min(100%, 700px);
			max-height: calc(100vh - clamp(24px, 4vw, 48px));
			overflow: auto;
			background: var(--panel);
			backdrop-filter: blur(10px);
			border: 1px solid var(--stroke);
			border-radius: calc(var(--radius) + 4px);
			box-shadow: var(--shadow);
			padding: 30px 24px 24px;
			animation: lift-in 560ms ease-out both;
		}

		.brand {
			display: flex;
			justify-content: center;
			margin-bottom: 14px;
		}

		.brand-logo {
			width: min(100%, 320px);
			height: auto;
			display: block;
		}

		.title {
			font-family: "Playfair Display", serif;
			font-size: clamp(1.7rem, 4vw, 2.1rem);
			line-height: 1.1;
			margin-bottom: 8px;
		}

		.subtitle {
			color: var(--muted);
			margin-bottom: 18px;
			font-size: 0.95rem;
		}

		.email-box {
			background: rgba(255, 255, 255, 0.95);
			border: 1px solid var(--stroke);
			border-radius: 12px;
			padding: 12px;
			margin-bottom: 16px;
			font-weight: 700;
			word-break: break-word;
		}

		.field {
			display: grid;
			gap: 6px;
			margin-bottom: 12px;
		}

		.field label {
			font-weight: 700;
			font-size: 0.9rem;
		}

		.field input {
			width: 100%;
			padding: 12px 13px;
			border: 1px solid var(--stroke);
			border-radius: 12px;
			font: inherit;
		}

		.actions {
			display: grid;
			gap: 10px;
		}

		.btn {
			border: none;
			border-radius: 12px;
			padding: 12px 14px;
			font: inherit;
			font-weight: 800;
			cursor: pointer;
			transition: transform 150ms ease, box-shadow 150ms ease, filter 150ms ease, background-color 150ms ease;
		}

		.btn:hover {
			transform: translateY(-2px);
			box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
		}

		.btn:active {
			transform: translateY(1px);
			box-shadow: none;
		}

		.btn-verify {
			background: var(--accent);
			color: #fff;
		}

		.btn-verify:hover {
			filter: brightness(1.06);
		}

		.btn-back {
			background: var(--accent-soft);
			color: var(--accent);
		}

		.btn-back:hover {
			filter: brightness(0.98);
		}

		.status {
			margin-top: 10px;
			font-size: 0.86rem;
			color: var(--muted);
		}

		@keyframes lift-in {
			from {
				opacity: 0;
				transform: translateY(12px) scale(0.98);
			}
			to {
				opacity: 1;
				transform: translateY(0) scale(1);
			}
		}

		@media (min-width: 1100px) {
			.verify-shell {
				width: min(100%, 820px);
			}
		}
	</style>
</head>
<body>
	<main class="verify-shell" aria-label="Email verification">
		<div class="brand">
			<img class="brand-logo" src="assets/itrack-final.png" alt="I-Track Project I-Track logo">
		</div>

		<h1 class="title">Verify Your Account</h1>
		<p class="subtitle">Use the verification link from your email:</p>
		<div class="email-box" id="emailTarget">No email found</div>

		<div class="field">
			<label for="resendEmail">Email Address</label>
			<input id="resendEmail" type="email" autocomplete="email" placeholder="Enter your account email">
		</div>

		<div class="actions">
			<button id="verifyButton" class="btn btn-verify" type="button">Verify Account</button>
			<button id="resendButton" class="btn btn-back" type="button">Resend Verification Email</button>
			<button class="btn btn-back" type="button" onclick="window.location.href='create.html'">Back to Create Account</button>
			<button class="btn btn-back" type="button" onclick="window.location.href='signout.html'">Sign Out</button>
		</div>
		<p class="status" id="statusMsg">Waiting for verification token...</p>
	</main>

	<script>
		(function () {
			const emailTarget = document.getElementById("emailTarget");
			const resendEmailInput = document.getElementById("resendEmail");
			const verifyButton = document.getElementById("verifyButton");
			const resendButton = document.getElementById("resendButton");
			const statusMsg = document.getElementById("statusMsg");
			const params = new URLSearchParams(window.location.search);
			const token = params.get("token");
			const email = params.get("email");

			emailTarget.textContent = email ? email : "Check your inbox for the verification email.";
			resendEmailInput.value = email ? email : "";

			async function parseApiPayload(response) {
				const raw = await response.text();
				if (!raw) {
					return {};
				}

				try {
					return JSON.parse(raw);
				} catch (error) {
					return { message: "Server returned an unexpected response format." };
				}
			}

			async function verifyAccount() {
				if (!token) {
					statusMsg.textContent = "No verification token found. Open the Verify Account button from your email.";
					verifyButton.disabled = true;
					verifyButton.style.opacity = "0.5";
					verifyButton.style.cursor = "not-allowed";
					return;
				}

				statusMsg.textContent = "Verifying account...";
				verifyButton.disabled = true;
				verifyButton.style.opacity = "0.6";

				try {
					const response = await fetch("/api/auth/verify", {
						method: "POST",
						headers: {
							"Content-Type": "application/json"
						},
						body: JSON.stringify({ token: token })
					});

					const payload = await parseApiPayload(response);
					if (!response.ok) {
						throw new Error(payload.message || "Verification failed.");
					}

					statusMsg.textContent = "Verified. Redirecting to your account...";
					window.location.href = "account.html";
				} catch (error) {
					statusMsg.textContent = error.message || "Verification failed.";
					verifyButton.disabled = false;
					verifyButton.style.opacity = "1";
					verifyButton.style.cursor = "pointer";
				}
			}

			verifyButton.addEventListener("click", function () {
				verifyAccount();
			});

			resendButton.addEventListener("click", async function () {
				const resendEmail = resendEmailInput.value.trim();
				if (!resendEmail) {
					statusMsg.textContent = "Enter your email to resend verification.";
					return;
				}

				resendButton.disabled = true;
				resendButton.style.opacity = "0.6";
				statusMsg.textContent = "Sending verification email...";

				try {
					const response = await fetch("/api/auth/resend-verification", {
						method: "POST",
						headers: {
							"Content-Type": "application/json"
						},
						body: JSON.stringify({ email: resendEmail })
					});

					const payload = await parseApiPayload(response);
					if (!response.ok) {
						if (response.status === 429 && payload.retryAfterSeconds) {
							throw new Error("Too many requests. Try again in " + payload.retryAfterSeconds + " seconds.");
						}
						throw new Error(payload.message || "Unable to resend verification email.");
					}

					statusMsg.textContent = "Verification email resent to " + payload.email + ".";
					emailTarget.textContent = payload.email;
				} catch (error) {
					statusMsg.textContent = error.message || "Unable to resend verification email.";
				} finally {
					resendButton.disabled = false;
					resendButton.style.opacity = "1";
				}
			});

			if (token) {
				verifyAccount();
			} else {
				statusMsg.textContent = "Please check your email to verify your account.";
			}
		})();
	</script>

<script src="/theme.js"></script>
</body>
</html>
