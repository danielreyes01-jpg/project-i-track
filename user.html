<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>User Approval</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="/theme.css">
	<style>
		:root {
			--bg-1: #f3efe6;
			--bg-2: #dfecd9;
			--ink: #1e2a21;
			--muted: #5d6a61;
			--panel: rgba(255, 255, 255, 0.86);
			--stroke: rgba(30, 42, 33, 0.14);
			--accent: #14532d;
			--warn: #8a2d0a;
			--radius: 16px;
			--shadow: 0 22px 52px rgba(20, 52, 33, 0.14);
		}

		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		body {
			min-height: 100vh;
			font-family: "Manrope", sans-serif;
			color: var(--ink);
			background:
				radial-gradient(circle at 15% 20%, rgba(31, 122, 68, 0.18), transparent 38%),
				radial-gradient(circle at 80% 5%, rgba(95, 142, 104, 0.22), transparent 36%),
				linear-gradient(145deg, var(--bg-1), var(--bg-2));
			display: grid;
			place-items: center;
			padding: 20px clamp(10px, 1.8vw, 26px);
		}

		.shell {
			width: min(100%, 1360px);
			max-height: calc(100vh - clamp(24px, 4vw, 50px));
			overflow: auto;
			background: var(--panel);
			border: 1px solid var(--stroke);
			border-radius: calc(var(--radius) + 4px);
			box-shadow: var(--shadow);
			padding: clamp(18px, 1.8vw, 28px);
		}

		.brand {
			display: flex;
			justify-content: center;
			margin-bottom: 12px;
		}

		.brand-logo {
			width: min(100%, 280px);
			height: auto;
			display: block;
		}

		h1 {
			font-family: "Playfair Display", serif;
			font-size: clamp(1.6rem, 3.2vw, 2.1rem);
			margin-bottom: 6px;
		}

		.subtitle {
			color: var(--muted);
			font-size: 0.95rem;
			line-height: 1.45;
			margin-bottom: 18px;
		}

		.toolbar {
			display: grid;
			grid-template-columns: 1fr auto auto;
			gap: 10px;
			margin-bottom: 12px;
		}

		input {
			width: 100%;
			border: 1px solid var(--stroke);
			border-radius: 10px;
			padding: 11px 12px;
			font: inherit;
			background: #fff;
		}

		button {
			border: none;
			border-radius: 10px;
			padding: 11px 14px;
			font: inherit;
			font-weight: 800;
			cursor: pointer;
			transition: transform 150ms ease, box-shadow 150ms ease, filter 150ms ease;
		}

		button:hover {
			transform: translateY(-2px);
			box-shadow: 0 6px 20px rgba(0, 0, 0, 0.10);
			filter: brightness(1.04);
		}

		button:active {
			transform: translateY(1px);
			box-shadow: none;
		}

		.btn-primary {
			background: var(--accent);
			color: #fff;
		}

		.btn-secondary {
			background: #d7e9dd;
			color: var(--accent);
		}

		.message {
			display: none;
			padding: 10px 12px;
			border-radius: 10px;
			font-size: 0.88rem;
			font-weight: 700;
			margin-bottom: 10px;
		}

		.message.error {
			display: block;
			background: #fde9e2;
			color: var(--warn);
			border: 1px solid #f7c3b1;
		}

		.message.success {
			display: block;
			background: #e5f7ea;
			color: #14532d;
			border: 1px solid #b8e7c5;
		}

		.table-wrap {
			overflow: auto;
			border: 1px solid var(--stroke);
			border-radius: 12px;
			background: #fff;
		}

		.table-wrap.hidden {
			display: none;
		}

		table {
			width: 100%;
			border-collapse: collapse;
			min-width: 1120px;
			table-layout: fixed;
		}

		th,
		td {
			padding: 10px 11px;
			border-bottom: 1px solid #edf2ed;
			text-align: left;
			font-size: 0.9rem;
			vertical-align: top;
		}

		th,
		td {
			overflow-wrap: anywhere;
		}

		/* 1: select */
		th:nth-child(1),
		td:nth-child(1) {
			width: 44px;
			min-width: 44px;
			max-width: 44px;
			text-align: center;
		}

		/* 2: name */
		th:nth-child(2),
		td:nth-child(2) {
			min-width: 180px;
		}

		/* 3: email */
		th:nth-child(3),
		td:nth-child(3) {
			min-width: 220px;
		}

		/* 4-5: district/school */
		th:nth-child(4),
		td:nth-child(4),
		th:nth-child(5),
		td:nth-child(5) {
			min-width: 140px;
		}

		/* 6: role */
		th:nth-child(6),
		td:nth-child(6) {
			min-width: 110px;
			white-space: nowrap;
		}

		/* 7: status */
		th:nth-child(7),
		td:nth-child(7) {
			min-width: 110px;
			white-space: nowrap;
		}

		/* 8: created */
		th:nth-child(8),
		td:nth-child(8) {
			min-width: 170px;
			white-space: nowrap;
		}

		/* 9: actions/dropdown */
		th:nth-child(9),
		td:nth-child(9) {
			min-width: 170px;
		}

		th {
			background: #f5faf7;
			font-size: 0.82rem;
			text-transform: uppercase;
			letter-spacing: 0.04em;
		}

		.status-pill {
			display: inline-block;
			padding: 4px 8px;
			border-radius: 999px;
			font-size: 0.78rem;
			font-weight: 800;
		}

		.status-approved {
			background: #dbf2e4;
			color: #14532d;
		}

		.status-pending {
			background: #f6e5dc;
			color: #7b2503;
		}

		.row-actions {
			display: flex;
			flex-wrap: wrap;
			align-items: center;
			gap: 8px;
			width: 100%;
		}

		.row-actions button {
			padding: 8px 10px;
			font-size: 0.8rem;
			border-radius: 8px;
		}

		.approve {
			background: #14532d;
			color: #fff;
		}

		.reject {
			background: #f3d8ce;
			color: #7b2503;
		}

		.delete {
			background: #7f1d1d;
			color: #fff;
		}

		.empty {
			padding: 16px;
			color: var(--muted);
			font-size: 0.9rem;
		}

		.role-pill {
			display: inline-block;
			padding: 3px 8px;
			border-radius: 999px;
			font-size: 0.75rem;
			font-weight: 800;
			text-transform: capitalize;
		}

		.role-admin {
			background: #ede9fe;
			color: #4c1d95;
		}

		.role-supervisor {
			background: #fef3c7;
			color: #78350f;
		}

		.role-teacher {
			background: #dcfce7;
			color: #14532d;
		}

		.role-select {
			padding: 6px 8px;
			border: 1px solid var(--stroke);
			border-radius: 8px;
			font: inherit;
			font-size: 0.8rem;
			cursor: pointer;
			background: #fff;
			min-width: 118px;
			width: 100%;
			max-width: 180px;
		}

		.bulk-actions {
			display: flex;
			gap: 10px;
			margin-bottom: 12px;
			flex-wrap: wrap;
		}

		.bulk-actions .approve,
		.bulk-actions .reject,
		.bulk-actions .delete {
			padding: 10px 14px;
			font-size: 0.86rem;
			border-radius: 10px;
		}

		.select-col {
			width: 36px;
			text-align: center;
		}

		input.user-select,
		#selectAllUsers {
			width: 16px;
			height: 16px;
			cursor: pointer;
		}

		.footer {
			margin-top: 12px;
			display: flex;
			justify-content: flex-end;
			gap: 10px;
			flex-wrap: wrap;
		}

		@media (max-width: 1200px) {
			table {
				min-width: 980px;
			}

			.shell {
				width: min(100%, 1180px);
			}
		}

		@media (max-width: 860px) {
			.toolbar {
				grid-template-columns: 1fr;
			}

			.bulk-actions {
				flex-direction: column;
			}

			.bulk-actions button {
				width: 100%;
			}

			.footer {
				justify-content: stretch;
				flex-direction: column;
			}

			.footer button {
				width: 100%;
			}
		}
	</style>
</head>
<body>
	<main class="shell">
		<div class="brand">
			<img class="brand-logo" src="assets/itrack-final.png" alt="I-Track Project I-Track logo">
		</div>
		<h1>User Approval Page</h1>
		<p class="subtitle">View all registrations and approve pending users.</p>

		<div class="toolbar">
			<input id="adminKey" type="password" placeholder="Enter ADMIN_ACCESS_KEY">
			<button id="loadBtn" class="btn-primary" type="button">Load Users</button>
			<button id="saveBtn" class="btn-secondary" type="button">Save Key</button>
		</div>

		<div id="message" class="message" role="status" aria-live="polite"></div>

		<div class="bulk-actions">
			<button id="approveSelectedBtn" class="approve" type="button">Approve</button>
			<button id="rejectSelectedBtn" class="reject" type="button">Reject</button>
			<button id="deleteSelectedBtn" class="delete" type="button">Delete</button>
		</div>

		<div id="usersSection" class="table-wrap hidden">
			<table>
				<thead>
					<tr>
						<th class="select-col"><input id="selectAllUsers" type="checkbox" aria-label="Select all users"></th>
						<th>Name</th>
						<th>Email</th>
						<th>District</th>
						<th>School</th>
						<th>Role</th>
						<th>Status</th>
						<th>Created</th>
						<th>Actions</th>
					</tr>
				</thead>
				<tbody id="usersBody"></tbody>
			</table>
		</div>

		<div class="footer">
			<button class="btn-secondary" type="button" onclick="window.location.href='dashboard.html'">Back to Admin Dashboard</button>
			<button class="btn-secondary" type="button" onclick="window.location.href='approval.html'">Back to Approval Portal</button>
			<button class="btn-secondary" type="button" onclick="window.location.href='signout.html'">Sign Out</button>
		</div>
	</main>

	<script>
		(function () {
			const AUTO_REFRESH_MS = 30000;
			const adminKeyInput = document.getElementById("adminKey");
			const loadBtn = document.getElementById("loadBtn");
			const saveBtn = document.getElementById("saveBtn");
			const message = document.getElementById("message");
			const usersBody = document.getElementById("usersBody");
			const usersSection = document.getElementById("usersSection");
			const selectAllUsers = document.getElementById("selectAllUsers");
			const approveSelectedBtn = document.getElementById("approveSelectedBtn");
			const rejectSelectedBtn = document.getElementById("rejectSelectedBtn");
			const deleteSelectedBtn = document.getElementById("deleteSelectedBtn");
			let autoRefreshTimer = null;

			adminKeyInput.value = localStorage.getItem("adminAccessKey") || "";

			function setMessage(text, type) {
				message.textContent = text;
				message.className = "message " + type;
			}

			function clearMessage() {
				message.textContent = "";
				message.className = "message";
			}

			function getAdminKey() {
				return adminKeyInput.value.trim();
			}

			function setUsersSectionVisible(isVisible) {
				usersSection.classList.toggle("hidden", !isVisible);
			}

			async function parseApiPayload(response) {
				const raw = await response.text();
				if (!raw) {
					return {};
				}

				try {
					return JSON.parse(raw);
				} catch (error) {
					return { message: "Server returned an unexpected response format." };
				}
			}

			function renderRows(users) {
				if (!users.length) {
					usersBody.innerHTML = '<tr><td class="empty" colspan="9">No user registrations found.</td></tr>';
					selectAllUsers.checked = false;
					return;
				}

				usersBody.innerHTML = users.map(function (user) {
					const name = [user.firstname, user.middlename, user.lastname].filter(Boolean).join(" ");
					const created = user.created_at ? new Date(user.created_at).toLocaleString() : "-";
					const approved = Boolean(user.approved);
					const statusText = approved ? "APPROVED" : "Pending";
					const statusClass = approved ? "status-pill status-approved" : "status-pill status-pending";
					const role = String(user.role || "teacher").toLowerCase();
					const rolePill = '<span class="role-pill role-' + role + '">' + role + '</span>';
					const roleSelect =
						'<select class="role-select" data-action="setRole" data-id="' + user.id + '">' +
							'<option value="teacher"' + (role === 'teacher' ? ' selected' : '') + '>Teacher</option>' +
							'<option value="supervisor"' + (role === 'supervisor' ? ' selected' : '') + '>Supervisor</option>' +
							'<option value="admin"' + (role === 'admin' ? ' selected' : '') + '>Admin</option>' +
						'</select>';
					const actionButtons =
						'<div class="row-actions">' + roleSelect + '</div>';

					return '<tr>' +
						'<td class="select-col"><input class="user-select" type="checkbox" data-id="' + user.id + '" aria-label="Select user ' + user.email + '"></td>' +
						'<td>' + name + '</td>' +
						'<td>' + user.email + '</td>' +
						'<td>' + (user.district || "-") + '</td>' +
						'<td>' + (user.school || "-") + '</td>' +
						'<td>' + rolePill + '</td>' +
						'<td><span class="' + statusClass + '">' + statusText + '</span></td>' +
						'<td>' + created + '</td>' +
						'<td>' + actionButtons + '</td>' +
					'</tr>';
				}).join("");

				selectAllUsers.checked = false;
			}

			function getSelectedUserIds() {
				return Array.from(usersBody.querySelectorAll("input.user-select:checked")).map(function (el) {
					return el.getAttribute("data-id");
				});
			}

			async function loadUsers(options) {
				const opts = options || {};
				const silent = Boolean(opts.silent);

				if (!silent) {
					clearMessage();
				}

				const adminKey = getAdminKey();
				if (!adminKey) {
					if (!silent) {
						setMessage("Enter admin access key first.", "error");
					}
					return;
				}

				try {
					const response = await fetch("/api/admin/users", {
						headers: { "x-admin-key": adminKey }
					});

					const payload = await parseApiPayload(response);
					if (!response.ok) {
						throw new Error(payload.message || "Failed to load users.");
					}

					renderRows(Array.isArray(payload.users) ? payload.users : []);
					setUsersSectionVisible(true);
					if (!silent) {
						setMessage("Users loaded.", "success");
					}
				} catch (error) {
					if (!silent) {
						setUsersSectionVisible(false);
						setMessage(error.message || "Failed to load users.", "error");
					}
				}
			}

			function startAutoRefresh() {
				if (autoRefreshTimer) {
					clearInterval(autoRefreshTimer);
				}

				autoRefreshTimer = setInterval(function () {
					if (document.hidden) {
						return;
					}

					if (usersSection.classList.contains("hidden")) {
						return;
					}

					if (!getAdminKey()) {
						return;
					}

					loadUsers({ silent: true });
				}, AUTO_REFRESH_MS);
			}

			async function applyAction(action, userId, extra, options) {
				const opts = options || {};
				const silent = Boolean(opts.silent);
				const skipReload = Boolean(opts.skipReload);
				const skipDeleteConfirm = Boolean(opts.skipDeleteConfirm);
				const adminKey = getAdminKey();
				if (!adminKey) {
					if (!silent) setMessage("Enter admin access key first.", "error");
					return false;
				}

				if (action === "delete" && !skipDeleteConfirm) {
					const confirmed = window.confirm("Delete this account and all linked learner records?");
					if (!confirmed) {
						return false;
					}
				}

				try {
					let response;
					if (action === "setRole") {
						response = await fetch("/api/admin/set-user-role", {
							method: "PUT",
							headers: {
								"Content-Type": "application/json",
								"x-admin-key": adminKey
							},
							body: JSON.stringify({ userId: userId, role: extra })
						});
					} else if (action === "delete") {
						response = await fetch("/api/admin/delete-user", {
							method: "DELETE",
							headers: {
								"Content-Type": "application/json",
								"x-admin-key": adminKey
							},
							body: JSON.stringify({ userId: userId })
						});
					} else {
						const endpoint = action === "approve" ? "/api/admin/approve-user" : "/api/admin/reject-user";
						response = await fetch(endpoint, {
							method: "POST",
							headers: {
								"Content-Type": "application/json",
								"x-admin-key": adminKey
							},
							body: JSON.stringify({ userId: userId })
						});
					}

					const payload = await parseApiPayload(response);
					if (!response.ok) {
						throw new Error(payload.message || "Action failed.");
					}

					if (!silent) setMessage(payload.message || "Action completed.", "success");
					if (action !== "setRole" && !skipReload) loadUsers();
					return true;
				} catch (error) {
					if (!silent) setMessage(error.message || "Action failed.", "error");
					return false;
				}
			}

			async function applyBulkAction(action) {
				const selectedIds = getSelectedUserIds();
				if (!selectedIds.length) {
					setMessage("Select at least one user first.", "error");
					return;
				}

				if (action === "delete") {
					const confirmed = window.confirm("Delete selected accounts and all linked learner records?");
					if (!confirmed) return;
				}

				let successCount = 0;
				let failedCount = 0;

				for (const userId of selectedIds) {
					const ok = await applyAction(action, userId, null, {
						silent: true,
						skipReload: true,
						skipDeleteConfirm: true
					});
					if (ok) {
						successCount += 1;
					} else {
						failedCount += 1;
					}
				}

				if (failedCount > 0) {
					setMessage("Bulk action completed with some failures. Success: " + successCount + ", Failed: " + failedCount + ".", "error");
				} else {
					setMessage("Bulk action completed. Success: " + successCount + ".", "success");
				}

				loadUsers();
			}

			loadBtn.addEventListener("click", function () {
				loadUsers({ silent: false });
			});

			saveBtn.addEventListener("click", function () {
				localStorage.setItem("adminAccessKey", getAdminKey());
				setMessage("Admin key saved on this browser.", "success");
			});

			usersBody.addEventListener("click", function (event) {
				const button = event.target.closest("button[data-action]");
				if (!button) return;
				applyAction(button.getAttribute("data-action"), button.getAttribute("data-id"), null);
			});

			selectAllUsers.addEventListener("change", function () {
				const checked = selectAllUsers.checked;
				usersBody.querySelectorAll("input.user-select").forEach(function (box) {
					box.checked = checked;
				});
			});

			usersBody.addEventListener("change", function (event) {
				if (event.target.matches("input.user-select")) {
					const allBoxes = usersBody.querySelectorAll("input.user-select");
					const checkedBoxes = usersBody.querySelectorAll("input.user-select:checked");
					selectAllUsers.checked = allBoxes.length > 0 && checkedBoxes.length === allBoxes.length;
				}
			});

			approveSelectedBtn.addEventListener("click", function () {
				applyBulkAction("approve");
			});

			rejectSelectedBtn.addEventListener("click", function () {
				applyBulkAction("reject");
			});

			deleteSelectedBtn.addEventListener("click", function () {
				applyBulkAction("delete");
			});

			usersBody.addEventListener("change", function (event) {
				const select = event.target.closest("select[data-action='setRole']");
				if (!select) return;
				applyAction("setRole", select.getAttribute("data-id"), select.value);
			});

			startAutoRefresh();
		})();
	</script>

<script src="/theme.js"></script>
</body>
</html>
